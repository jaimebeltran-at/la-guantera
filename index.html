/* ===================== mando a distancia entre tus aparatos ===================== */
function initRoom(){const R=C.room;
  R.onPeers(ch=>{S.peers=ch.peers.slice();const me=ch.peers.find(p=>p.sameTab);if(me)S.myPeer=me.peer;
    if(S.ctrl&&!S.peers.some(p=>p.peer===S.ctrl)){stopControl();toast('El otro aparato se ha desconectado');}
    renderDevices();if(S.ctrl){renderPlayer();renderDials();}},()=>{});
  R.on('cmd',msg=>{if(!msg.isMe||msg.sameTab)return;const d=msg.data||{};if(d.to!==S.myPeer)return;handleCmd(d);},()=>{});
  presenceNow();}
const presenceSoon=debounce(()=>presenceNow(),400);
function presenceNow(){if(!C.room||!device)return;const t=P.current,d=AE.el;
  C.room.presence({dev:device.id,dn:device.name,dk:device.kind,st:t&&!d.paused?'play':t?'pause':'idle',tid:t&&!t.test?t.id:null,
    pos:Math.round((d.currentTime||0)*10)/10,dur:Math.round(((isFinite(d.duration)&&d.duration)||(t&&t.du)||0)*10)/10,at:Date.now(),sh:P.shuffle,rp:P.repeat,vol:Math.round(prefs.vol*100)/100}).catch(()=>{});}
function sendCmd(peer,d){if(!C.room)return;C.room.emit('cmd',Object.assign({to:peer},d)).catch(e=>{if(e&&e.code==='not_permitted')toast('Este aparato no puede mandar órdenes');});}
const ctrlName=()=>{const p=S.peers.find(x=>x.peer===S.ctrl);return p&&p.presence&&p.presence.dn;};
function remoteCmd(d){if(!S.ctrl)return;sendCmd(S.ctrl,d);if(d.op==='play')toast('Enviado al '+(ctrlName()||'otro aparato'));}
let ctrlTimer=0;
function startControl(peer){S.ctrl=peer;const p=S.peers.find(x=>x.peer===peer);S.rvol=(p&&p.presence&&p.presence.vol)??.8;clearInterval(ctrlTimer);
  ctrlTimer=setInterval(()=>updateTime(),1000);$$('[data-knob]').forEach(k=>k._upd&&k._upd());renderPlayer(true);renderDials();toast('Mandas en el '+(ctrlName()||'otro aparato'));}
function stopControl(){S.ctrl=null;clearInterval(ctrlTimer);$$('[data-knob]').forEach(k=>k._upd&&k._upd());renderPlayer(true);renderDials();}
function takeOver(p){sendCmd(p.peer,{op:'handoff',from:S.myPeer});toast('Pasando la música a este aparato…');}
function handleCmd(d){const ids=a=>(a||[]).filter(id=>S.tracks.has(id));
  switch(d.op){case 'play':P.play(ids(d.ids),d.start|0,d.src||'',d.sh===undefined?{}:{shuffle:!!d.sh});break;
    case 'toggle':P.toggle();break;case 'play1':P.resume();break;case 'pause':P.pause();break;case 'next':P.next();break;case 'prev':P.prev();break;
    case 'seek':P.seek(+d.pos||0);break;case 'shuffle':P.toggleShuffle();break;case 'repeat':P.cycleRepeat();break;
    case 'vol':setVol(+d.v);savePrefsSoon();break;case 'add':P.enqueue(ids(d.ids),false);break;case 'next-up':P.enqueue(ids(d.ids),true);break;
    case 'handoff':{const q=P.q.filter(id=>S.tracks.has(id)),ci=Math.max(0,q.indexOf(P.q[P.qi]));const pos=AE.el.currentTime||0;P.pause();
      sendCmd(d.from,{op:'take',q:q.slice(ci,ci+150),pos,src:P.src});break;}
    case 'take':{const q=ids(d.q);if(q.length){P.shuffle=false;P.orig=q.slice();P.q=q;P.src=d.src||'';P.load(0,{pos:+d.pos||0});}break;}}}
function openDevices(){openSheet(h('div',{class:'row'},h('h3',null,'Tus aparatos'),h('span',{class:'sp'}),h('button',{class:'ibtn',onclick:closeLayer,'aria-label':'Cerrar'},ic('close'))),h('div',{id:'devBox',class:'menu'}));renderDevices();}

<script>
"use strict";
/* ===================== Claude DJ ===================== */
const DJ_PRESETS=[
  {k:'conducir',nm:'Para conducir',p:'Música para conducir por carretera: ritmo constante y con ganas, sin baladas lentas.'},
  {k:'manana',nm:'Buenos días',p:'Para arrancar la mañana de buen humor, de menos a más energía.'},
  {k:'noche',nm:'Noche tranquila',p:'Para conducir de noche o relajarse: tranquilo, elegante, sin sobresaltos.'},
  {k:'subidon',nm:'Subidón',p:'Energía alta: lo más animado y potente que tenga.'},
  {k:'olvidadas',nm:'Redescubre',p:'Canciones suyas que lleva tiempo sin escuchar (que no estén entre lo más escuchado ni en lo reciente), bien hiladas.'},
  {k:'mix',nm:'Mix del día',p:'Una mezcla variada para hoy: algo de lo que más escucha, algo olvidado y alguna sorpresa, bien hilada.'}];
const DJ={busy:false,title:'',got:0,err:''};
function topArtistsLocal(n){const a=(S.stats&&S.stats.art)||{};return Object.entries(a).sort((x,y)=>y[1]-x[1]).slice(0,n).map(x=>x[0]);}
function topIdsLocal(n){const p=(S.stats&&S.stats.plays)||{};return Object.entries(p).sort((x,y)=>y[1]-x[1]).slice(0,n).map(x=>x[0]).filter(id=>S.tracks.has(id));}
function libListing(maxBytes=150000){const idx=[],lines=[];let bytes=0;
  const pick=S.tracks.size>2600?new Set([...likedIds(),...topIdsLocal(400),...shuffleArr(S.allIds).slice(0,1800)]):null;
  for(const A of S.albums){const ids=pick?A.ids.filter(id=>pick.has(id)):A.ids;if(!ids.length)continue;const t0=S.tracks.get(ids[0]);
    const head='## '+A.artist+' — '+A.title+(A.year?' ('+A.year+')':'')+(t0.g?' ['+t0.g+']':'');lines.push(head);bytes+=head.length+1;
    for(const id of ids){const t=S.tracks.get(id),line=idx.length+' '+(t.t||'?')+(t.a&&t.a!==A.artist?' — '+t.a:'');idx.push(id);lines.push(line);bytes+=line.length+1;}
    if(bytes>maxBytes)break;}
  return{text:lines.join('\n'),idx};}
function djPrompt(req,n,listing){const d=new Date();
  const when=d.toLocaleDateString('es-ES',{weekday:'long'})+', '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const where=device?{car:'en el coche',phone:'en el móvil',pc:'en el ordenador'}[device.kind]:'';const top=topArtistsLocal(8).join(', ');
  const recent=((S.stats&&S.stats.recent)||[]).slice(0,15).map(r=>getTrack(r[0])).filter(Boolean).map(t=>t.t+' — '+t.a).join('; ');
  return 'Haces de DJ en el reproductor de música personal de quien te escribe. Solo puedes elegir canciones de SU biblioteca, que va al final: cada canción lleva delante un número.\n'+
    'Petición: '+req+'\nContexto: '+when+(where?', escuchando '+where:'')+'.'+(top?' Artistas que más escucha este mes: '+top+'.':'')+(recent?' Acaba de escuchar (no las repitas): '+recent+'.':'')+'\n'+
    'Arma una sesión de unas '+n+' canciones (menos si no hay suficientes que encajen) con un orden que fluya en energía, ritmo y época. No pongas más de dos seguidas del mismo artista. Usa lo que sabes de cada artista y canción para acertar con el ambiente.\n'+
    'Responde SOLO con líneas JSON, una por línea, sin nada más:\nprimera línea: {"titulo":"nombre corto y con gracia para la sesión","intro":"una frase en español de España, como un locutor de radio elegante, sin emojis"}\n'+
    'después, una línea por canción, en orden: {"n":número}\n\nBIBLIOTECA\n'+listing;}
async function claudeAsk(prompt,maxTokens=1600){const key=(S.cfg.apiKey||'').trim();if(!key)throw{code:'no_key'};if(!navigator.onLine)throw{code:'offline'};
  for(const model of [S.cfg.model||'claude-haiku-5-5','claude-haiku-4-5']){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model,max_tokens:maxTokens,messages:[{role:'user',content:prompt}]})});
    const j=await r.json().catch(()=>({}));
    if(r.status===404&&model!=='claude-haiku-4-5')continue;
    if(!r.ok)throw{code:r.status===401?'bad_key':r.status===429?'rate_limited':(r.status===529||r.status===503)?'overloaded':r.status===400&&/credit/i.test((j.error&&j.error.message)||'')?'no_credit':'http_'+r.status};
    return(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');}
  throw{code:'no_model'};}
function djErr(code){return code==='no_key'?'Pon tu clave de la API de Anthropic en Ajustes para usar el DJ.':code==='bad_key'?'La clave de la API no es válida. Revísala en Ajustes.':
  code==='no_credit'?'Tu cuenta de la API de Anthropic se ha quedado sin saldo.':code==='rate_limited'?'Demasiadas peticiones seguidas. Prueba en un minuto.':
  code==='overloaded'?'Claude está saturado ahora mismo. Prueba en un rato.':code==='offline'?'Sin conexión.':'No se pudo hablar con el DJ'+(code?' ('+code+')':'')+'.';}
async function runDj(req,label){
  if(!S.tracks.size){toast('Primero busca tus canciones en Tu Drive');return;}if(!S.cfg.apiKey){toast(djErr('no_key'),5000);return;}if(DJ.busy)return;
  Object.assign(DJ,{busy:true,err:'',title:label||'Sesión a medida',got:0});renderDjStatus();toast('El DJ está eligiendo…',2500);
  const {text,idx}=libListing();const n=Math.max(8,Math.min(25,Math.round(idx.length/3)));const ids=[];
  try{const out=await claudeAsk(djPrompt(req,n,text));
    for(const raw of out.split('\n')){const line=raw.trim().replace(/^```(json)?/,'').replace(/```$/,'').trim();if(!line)continue;let o;try{o=JSON.parse(line);}catch{continue;}
      if(o&&o.titulo){DJ.title=String(o.titulo).slice(0,60);if(o.intro)toast(String(o.intro).slice(0,220),7000);continue;}
      const id=o&&o.n!=null?idx[+o.n]:null;if(id&&!ids.includes(id))ids.push(id);}
    DJ.got=ids.length;if(!ids.length)DJ.err='El DJ no ha encontrado canciones que encajen. Prueba con otra petición.';else P.play(ids,0,'dj',{shuffle:false});}
  catch(e){DJ.err=djErr(e&&e.code);}
  finally{DJ.busy=false;renderDjStatus();renderPlayer();if(DJ.err)toast(DJ.err,5000);}}
ACT.djPreset=el=>{closeLayer();const p=DJ_PRESETS.find(x=>x.k===el.dataset.p);if(p)runDj(p.p,p.nm);};
ACT.carDj=()=>openSheet(h('div',{class:'row'},h('h3',null,'Claude DJ'),h('span',{class:'sp'}),h('button',{class:'ibtn',onclick:closeLayer,'aria-label':'Cerrar'},ic('close'))),
  h('div',{class:'steps'},...DJ_PRESETS.map(p=>h('button',{class:'pbtn',style:'min-height:60px;font-size:17px','data-act':'djPreset','data-p':p.k},p.nm))),
  h('div',{class:'sub'},'Para pedirle algo concreto, usa la pantalla DJ fuera del modo coche.'));
function renderDjStatus(){const el=$('#djStatus');if(el)el.textContent=DJ.busy?'Pensando la sesión…':
  DJ.err?DJ.err:DJ.got?'«'+DJ.title+'» · '+plural(DJ.got,'canción','canciones'):'';}

const DISC={list:null,busy:false,err:''};
async function discover(fresh){if(DISC.busy)return;if(!S.cfg.apiKey){DISC.err=djErr('no_key');renderDisc();return;}DISC.busy=true;DISC.err='';renderDisc();
  const top=topArtistsLocal(12),names=S.artists.slice(0,400).map(R=>R.name).join('; ');
  const prompt='Te paso los artistas que alguien tiene en su biblioteca de música'+(top.length?' y los que más escucha':'')+'. Recomiéndale 6 artistas que NO estén en la lista y que probablemente le encanten, variados entre sí.\n'+
    (top.length?'Más escuchados: '+top.join(', ')+'\n':'')+'Su biblioteca: '+names+'\n'+
    'Responde solo con un array JSON de 6 objetos {"artista":"...","porque":"una frase en español de España que lo relacione con lo que ya escucha","empieza":"un álbum o canción concreta para empezar"}.';
  try{const txt=await claudeAsk(prompt,1200);const m=txt.match(/\[[\s\S]*\]/);const r=m?JSON.parse(m[0]):[];DISC.list=(Array.isArray(r)?r:[]).filter(x=>x&&x.artista).slice(0,6);}
  catch(e){DISC.err=djErr(e&&e.code);}finally{DISC.busy=false;renderDisc();}}
function renderDisc(){const box=$('#discBox');if(!box)return;box.textContent='';
  if(DISC.busy){box.append(h('div',{class:'lcd',style:'padding:12px 14px'},'BUSCANDO ARTISTAS PARA TI…'));return;}

  box.append(h('div',{class:'two'},...DISC.list.map(x=>h('div',{class:'step'},h('b',{style:'font:400 21px/1.2 var(--f-display)'},String(x.artista)),
    h('span',{class:'sub'},String(x.porque||'')),x.empieza?h('span',{style:'font-size:14px'},'Empieza por: ',h('b',null,String(x.empieza))):null,
    h('div',{class:'row',style:'font-size:14px'},h('a',{href:'https://bandcamp.com/search?q='+encodeURIComponent(x.artista),target:'_blank',rel:'noopener'},'Buscar en Bandcamp'),
      h('a',{href:'https://www.youtube.com/results?search_query='+encodeURIComponent(x.artista+' '+(x.empieza||'')),target:'_blank',rel:'noopener'},'Escuchar en YouTube'))))));}

function viewDj(v){v.append(h('h1',null,'Claude DJ'),h('p',{class:'sub',style:'margin:0;max-width:62ch'},'Pídele un ambiente y monta una sesión solo con tu música. Tarda unos segundos en pensarla.'));
  if(!S.cfg.apiKey){v.append(h('div',{class:'note'},'Para usar el DJ, pega tu clave de la API de Anthropic en Ajustes. Se guarda en tu Drive y sirve para todos tus aparatos.'),h('div',null,h('button',{class:'pbtn amber','data-act':'go','data-v':'ajustes'},ic('gear'),'Ir a Ajustes')));return;}
  if(!S.tracks.size){v.append(onboarding());return;}
  const ta=h('textarea',{id:'djReq',rows:'2',maxlength:'400',placeholder:'Ejemplo: rock de los ochenta para la autopista, que vaya subiendo',
    style:'width:100%;resize:vertical;min-height:64px;background:transparent;border:1px solid #3a2a17;border-radius:6px;color:var(--amber-hi);font:18px/1.35 var(--f-lcd);padding:10px 12px;position:relative;z-index:1'});
  const send=()=>{const r=ta.value.trim();if(!r){ta.focus();return;}runDj(r,'');};

  v.append(h('div',{class:'sec'},h('label',{class:'lcd',style:'padding:14px 16px;display:flex;flex-direction:column;gap:8px'},h('span',{class:'dim',style:'font-size:12px'},'PETICIÓN AL DJ'),ta),
    h('div',{class:'row'},h('button',{class:'pbtn amber',onclick:send},ic('dj'),'Pinchar'),      h('span',{id:'djStatus',class:'sub',style:'color:var(--amber-hi)'}))));
  v.append(h('div',{class:'sec'},secH('Ambientes'),h('div',{class:'row'},...DJ_PRESETS.map(p=>h('button',{class:'chip','data-act':'djPreset','data-p':p.k},p.nm)))));
  v.append(h('div',{class:'sec'},secH('Artistas que te podrían gustar',DISC.list?h('button',{class:'chip',onclick:()=>discover(true)},'Otra tanda'):null),h('div',{id:'discBox',class:'sec'})));
  v.append(h('div',{class:'note'},'Cada sesión cuesta unos céntimos de tu saldo de la API de Anthropic.'));
  renderDisc();renderDjStatus();}

/* ===================== tu resumen ===================== */
const WR={period:'mes',docs:null,busy:false,err:'',at:0,comment:'',cbusy:false};
async function loadWrapped(){WR.busy=true;
  try{if(!AUTH.ok())throw{code:'no_token'};const j=await gjson('/files',{spaces:'appDataFolder',q:"name contains 'escuchas-'",fields:'files(id,name)',pageSize:1000});
    WR.docs=(await Promise.all(j.files.map(f=>gfetch(G+'/files/'+f.id+'?alt=media').then(r=>r.json()).catch(()=>null)))).filter(Boolean);
    if(S.stats){const i=WR.docs.findIndex(d=>d.dev===S.stats.dev&&d.ym===S.stats.ym);if(i>=0)WR.docs[i]=S.stats;else WR.docs.push(S.stats);}WR.err='';}
  catch(e){WR.err=e&&e.code==='no_token'?'Conéctate con Google para sumar las escuchas de todos tus aparatos. Ahora ves solo las de este.':'No se pudieron leer tus escuchas.';WR.docs=S.stats?[S.stats]:(WR.docs||[]);}
  WR.busy=false;WR.at=Date.now();if(S.view==='resumen'&&!S.stack.length)renderView(true);}
function aggregate(period){const now=new Date(),y=String(now.getFullYear()),m=ym(now);
  const docs=(WR.docs||[]).filter(d=>period==='mes'?d.ym===m:period==='año'?String(d.ym||'').startsWith(y):true);

  for(const d of docs){A.total+=d.total||0;for(const k in d.plays||{})A.plays[k]=(A.plays[k]||0)+d.plays[k];for(const k in d.secs||{})A.secs[k]=(A.secs[k]||0)+d.secs[k];
    for(const k in d.art||{})A.art[k]=(A.art[k]||0)+d.art[k];for(const k in d.hrs||{})if(A.hrs[+k]!=null)A.hrs[+k]+=d.hrs[k];
    const dn=d.dn||(KIND[d.dk]||{}).name||'Aparato';A.dev[dn]=(A.dev[dn]||0)+(d.total||0);for(const k in d.days||{})if(d.days[k]>0)A.days.add(d.ym+'-'+k);}
  return A;}
function longestStreak(days){const arr=[...days].map(s=>Date.parse(s+'T12:00:00')).filter(isFinite).sort((a,b)=>a-b);let best=0,cur=0,prev=null;

const stat=(v,k)=>h('div',{class:'stat lcd'},h('span',{class:'v'},v),h('span',{class:'k'},k));
const meterRow=(name,val,max,right)=>h('div',{class:'it'},h('div',{style:'min-width:0;display:flex;flex-direction:column;gap:5px'},h('span',{class:'nm'},name),
  h('div',{class:'bar-meter','data-tip':name+' · '+right},h('i',{style:'width:'+Math.max(3,val/max*100)+'%'}))),h('span',{class:'vv'},right));
function viewWrapped(v){v.append(h('h1',null,'Tu resumen'),h('div',{class:'row'},...[['mes','Este mes'],['año','Este año'],['siempre','Desde siempre']].map(([k,nm])=>
    h('button',{class:'chip'+(WR.period===k?' on':''),onclick:()=>{WR.period=k;WR.comment='';renderView(true);}},nm))));

  const topArt=Object.entries(A.art).sort((a,b)=>b[1]-a[1]),topTr=Object.entries(A.plays).filter(([id])=>getTrack(id)).sort((a,b)=>b[1]-a[1]);
  const nPlays=Object.values(A.plays).reduce((s,x)=>s+x,0),alSecs={};
  for(const [id,s] of Object.entries(A.secs)){const t=S.tracks.get(id);if(t)alSecs[t.alId]=(alSecs[t.alId]||0)+s;}
  const topAl=Object.entries(alSecs).sort((a,b)=>b[1]-a[1])[0];
  v.append(h('div',{class:'stat-row'},stat(mins(A.total),'escuchando'),stat(String(nPlays),'canciones sonadas'),stat(String(Object.keys(A.art).length),'artistas distintos'),
    stat(plural(longestStreak(A.days),'día','días'),'de racha más larga')));
  const maxA=topArt.length?topArt[0][1]:1;
  v.append(h('div',{class:'two'},h('div',{class:'sec'},secH('Tus artistas'),h('div',{class:'rank'},...topArt.slice(0,8).map(([nm,s])=>meterRow(nm,s,maxA,mins(s))))),
    h('div',{class:'sec'},secH('Tus canciones'),topTr.length?h('div',{class:'rank'},...topTr.slice(0,8).map(([id,n])=>{const t=getTrack(id);
      return h('div',{class:'it'},h('button',{class:'nm',style:'text-align:left;min-width:0',onclick:()=>P.play([id],0,'')},h('span',{style:'font-weight:600'},t.t||''),h('span',{class:'sub'},' · '+(t.a||''))),
        h('span',{class:'vv'},plural(n,'vez','veces')));})):h('span',{class:'sub'},'Aún ninguna ha sonado entera.'))));
  const maxH=Math.max(...A.hrs,1);
  v.append(h('div',{class:'sec'},secH('A qué horas escuchas'),
    h('div',{class:'hours lcd',role:'img','aria-label':'Minutos escuchados en cada hora del día'},...A.hrs.map((s,i)=>h('i',{style:'height:'+Math.max(2,s/maxH*100)+'%','data-tip':i+':00 a '+(i+1)+':00 · '+mins(s)}))),
    h('div',{class:'hours-x'},h('span',null,'0 h'),h('span',null,'6 h'),h('span',null,'12 h'),h('span',null,'18 h')),
    h('details',null,h('summary',{class:'sub',style:'cursor:pointer'},'Ver como tabla'),h('table',{style:'border-collapse:collapse;font-size:13px;margin-top:8px'},
      h('tbody',null,...A.hrs.map((s,i)=>s?h('tr',null,h('td',{style:'padding:2px 14px 2px 0;color:var(--fg-2)'},i+':00 a '+(i+1)+':00'),h('td',{style:'font-variant-numeric:tabular-nums'},mins(s))):null))))));
  const devs=Object.entries(A.dev).sort((a,b)=>b[1]-a[1]),maxD=devs.length?devs[0][1]:1;
  v.append(h('div',{class:'sec'},secH('En qué aparato'),h('div',{class:'rank'},...devs.map(([nm,s])=>meterRow(nm,s,maxD,mins(s))))));
  if(topAl){const Al=S.albumById.get(topAl[0]);if(Al)v.append(h('div',{class:'sec'},secH('Tu disco'),h('div',{class:'hero',style:'align-items:center'},coverEl(Al.cover,Al.title),

<script>
"use strict";
/* ===================== leer canciones de tu Drive ===================== */
const JUNK=/\s*[\[(【]([^\])】]*?)\b(official|oficial|video|v[ií]deo|audio|lyrics?|letra|visuali[sz]er|hd|hq|4k|remaster(ed)?|clip|mv|videoclip|en vivo|live)\b([^\])】]*)[\])】]/gi;
const cleanArtist=a=>String(a||'').replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/,'').replace(/\s*Official$/i,'').trim();
const cleanTitle=s=>String(s||'').replace(JUNK,'').replace(/\s+(official|oficial)\s+(music\s+)?(video|audio)\s*$/i,'').replace(/\s{2,}/g,' ').replace(/^["“']+|["”']+$/g,'').trim();
/* carpeta Artista / "Año - Álbum" / "NN - Título.mp3", o "Artista - Título.mp3" suelto */
function nameMeta(fn,path){path=path||[];let base=cleanTitle(String(fn).replace(/\.[^.]+$/,'').replace(/_/g,' '));
  let n=0;const mn=base.match(/^(\d{1,3})\s*[-.)]\s*(.+)$/);if(mn){n=+mn[1];base=mn[2].trim();}
  let a='',t=base;if(!path[0]){const m=base.split(/\s+[-–—|]\s+/);if(m.length>=2){a=m[0].trim();t=m.slice(1).join(' - ').trim();}}
  let al='',y='';const ad=path[1]||'';if(ad){const my=ad.match(/^(\d{4})\s*[-–.]\s*(.+)$/);if(my){y=my[1];al=my[2].trim();}else al=ad;}
  return{t:(t||String(fn)).slice(0,200),a:(cleanArtist(a)||path[0]||'').slice(0,160),al:al.slice(0,200),y,n};}
const u32=(b,o)=>((b[o]<<24)>>>0)+(b[o+1]<<16)+(b[o+2]<<8)+b[o+3];
const synch=(b,o)=>((b[o]&127)<<21)|((b[o+1]&127)<<14)|((b[o+2]&127)<<7)|(b[o+3]&127);
function dec(d,enc){try{if(enc===0)return new TextDecoder('windows-1252').decode(d);if(enc===3)return new TextDecoder('utf-8').decode(d);
  if(enc===1){if(d[0]===0xFE&&d[1]===0xFF)return new TextDecoder('utf-16be').decode(d.subarray(2));if(d[0]===0xFF&&d[1]===0xFE)return new TextDecoder('utf-16le').decode(d.subarray(2));return new TextDecoder('utf-16le').decode(d);}
  return new TextDecoder('utf-16be').decode(d);}catch{return'';}}
const txt=d=>d.length?dec(d.subarray(1),d[0]).replace(/\u0000[\s\S]*$/,'').trim():'';
function skipStr(d,q,enc){if(enc===1||enc===2){while(q+1<d.length&&!(d[q]===0&&d[q+1]===0))q+=2;return q+2;}while(q<d.length&&d[q]!==0)q++;return q+1;}
function deunsync(d){const o=[];for(let i=0;i<d.length;i++){o.push(d[i]);if(d[i]===0xFF&&d[i+1]===0)i++;}return new Uint8Array(o);}
function parseID3(b){const ver=b[3],flags=b[5],size=synch(b,6),end=Math.min(b.length,10+size),out={};let p=10;
  if(flags&0x40)p+=ver===4?synch(b,10):u32(b,10)+4;
  if(ver<3){const map={TT2:'t',TP1:'a',TP2:'aa',TAL:'al',TYE:'y',TCO:'g',TRK:'n',TPA:'d'};
    while(p+6<=end){const id=String.fromCharCode(b[p],b[p+1],b[p+2]),sz=(b[p+3]<<16)|(b[p+4]<<8)|b[p+5];if(!/^[A-Z0-9]{3}$/.test(id)||sz<=0||p+6+sz>b.length)break;
      const d=b.subarray(p+6,p+6+sz);if(map[id]){const v=txt(d);if(v&&!out[map[id]])out[map[id]]=v;}
      else if(id==='PIC'&&!out.pic){const q=skipStr(d,5,d[0]);out.pic={mime:/png/i.test(dec(d.subarray(1,4),0))?'image/png':'image/jpeg',data:d.subarray(q)};}p+=6+sz;}}
  else{const map={TIT2:'t',TPE1:'a',TPE2:'aa',TALB:'al',TYER:'y',TDRC:'y',TCON:'g',TRCK:'n',TPOS:'d'};
    while(p+10<=end){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
      const sz=ver===4?synch(b,p+4):u32(b,p+4),ff=b[p+9];if(sz<=0||p+10+sz>b.length)break;let d=b.subarray(p+10,p+10+sz);
      if(ver===4&&(ff&1))d=d.subarray(4);if((ver===4&&(ff&2))||(flags&0x80))d=deunsync(d);
      if(map[id]){const v=txt(d);if(v&&!out[map[id]])out[map[id]]=v;}
      else if(id==='APIC'&&!out.pic){let q=1;while(q<d.length&&d[q]!==0)q++;const mime=dec(d.subarray(1,q),0);q=skipStr(d,q+2,d[0]);out.pic={mime:/png/i.test(mime)?'image/png':'image/jpeg',data:d.subarray(q)};}
      p+=10+sz;}}
  out.y=(String(out.y||'').match(/\d{4}/)||[''])[0];out.n=parseInt(out.n,10)||0;out.d=parseInt(out.d,10)||0;out.g=String(out.g||'').replace(/^\(\d+\)\s*/,'').slice(0,40);return out;}
function mp3Duration(b,start,size){const BR1=[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320],BR2=[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160];
  const SR={3:[44100,48000,32000],2:[22050,24000,16000],0:[11025,12000,8000]};
  for(let i=start;i<Math.min(b.length-40,start+16384);i++){if(b[i]!==0xFF||(b[i+1]&0xE0)!==0xE0)continue;
    const vb=(b[i+1]>>3)&3,lb=(b[i+1]>>1)&3,bi=(b[i+2]>>4)&15,si=(b[i+2]>>2)&3,mode=(b[i+3]>>6)&3;if(vb===1||lb!==1||bi===0||bi===15||si===3)continue;
    const v1=vb===3,sr=SR[vb][si],spf=v1?1152:576,br=(v1?BR1:BR2)[bi]*1000,x=i+4+(v1?(mode===3?17:32):(mode===3?9:17));
    const tag=String.fromCharCode(b[x],b[x+1],b[x+2],b[x+3]);if((tag==='Xing'||tag==='Info')&&(u32(b,x+4)&1))return Math.round(u32(b,x+8)*spf/sr*10)/10;
    if(String.fromCharCode(b[i+36],b[i+37],b[i+38],b[i+39])==='VBRI')return Math.round(u32(b,i+50)*spf/sr*10)/10;
    return Math.round((size-i)*8/br*10)/10;}return 0;}
async function readTags(f){const isMp3=/\.mp3$/i.test(f.n||'')||f.mt==='audio/mpeg';if(!isMp3)return{};
  const get=async n=>new Uint8Array(await(await gfetch(G+'/files/'+f.id+'?alt=media',{headers:{Range:'bytes=0-'+n}})).arrayBuffer());
  let b=await get(65535),tagLen=0;
  if(b[0]===0x49&&b[1]===0x44&&b[2]===0x33){tagLen=10+synch(b,6)+((b[5]&0x10)?10:0);if(tagLen+8192>b.length&&tagLen<6e6)b=await get(tagLen+8191);}
  const out=tagLen?parseID3(b):{};const du=mp3Duration(b,tagLen,f.sz||0);if(du)out.du=du;return out;}
async function coverBlob(pic){try{const bmp=await createImageBitmap(new Blob([pic.data],{type:pic.mime}));const W=bmp.width,H=bmp.height;
  const side=Math.min(W,H),sx=(W-side)/2,sy=(H-side)/2,cv=document.createElement('canvas');cv.width=cv.height=Math.min(256,side);
  cv.getContext('2d').drawImage(bmp,sx,sy,side,side,0,0,cv.width,cv.height);if(bmp.close)bmp.close();return await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));}catch{return null;}}

const SYNC={running:false,phase:'',done:0,total:0,cancel:false,deep:false,last:LS.get('lastSync',0),
  async folderId(){const name=(S.cfg.folder||'YouTube MP3').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const j=await gjson('/files',{q:`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`,fields:'files(id,name)',pageSize:10,supportsAllDrives:true,includeItemsFromAllDrives:true});
    if(!j.files.length)throw{code:'no_folder'};return j.files[0].id;},
  async listAudio(root){const out=[],info=new Map([[root,[]]]);let level=[root],folders=0;
    while(level.length&&!this.cancel){const next=[];
      for(let i=0;i<level.length&&!this.cancel;i+=40){const q='('+level.slice(i,i+40).map(id=>`'${id}' in parents`).join(' or ')+') and trashed=false';let pt='';
        do{const p={q,fields:'nextPageToken,files(id,name,mimeType,size,modifiedTime,parents)',pageSize:1000,supportsAllDrives:true,includeItemsFromAllDrives:true};if(pt)p.pageToken=pt;
          const j=await gjson('/files',p);for(const f of j.files){const par=(f.parents||[]).find(x=>info.has(x));const path=par?info.get(par):[];
            if(f.mimeType==='application/vnd.google-apps.folder'){info.set(f.id,[...path,f.name]);next.push(f.id);folders++;}
            else if(/^audio\//.test(f.mimeType)||AUDIO_EXT.test(f.name))out.push({id:f.id,n:f.name,mt:f.mimeType,sz:+f.size||0,m:f.modifiedTime,path});}
          pt=j.nextPageToken;this.phase='Buscando canciones… '+out.length+' (en '+folders+' carpetas)';renderSyncSoon();}while(pt&&!this.cancel);}
      level=next;}return out;},
  async run(deep){if(this.running)return;if(!AUTH.ok()){toast('Conéctate con Google primero');return;}
    Object.assign(this,{running:true,cancel:false,deep,done:0,total:0,phase:'Buscando la carpeta «'+S.cfg.folder+'»…'});renderSyncSoon();renderSoon();
    try{const fid=await this.folderId();const files=await this.listAudio(fid);if(this.cancel)throw{code:'cancel'};
      const idx=LIB.idx&&LIB.idx.folder===fid?structuredClone(LIB.idx):{v:1,folder:fid,tracks:{}};const seen=new Set();let added=0,removed=0;
      for(const f of files){seen.add(f.id);const e=idx.tracks[f.id];
        if(!e||e.m!==f.m){idx.tracks[f.id]=Object.assign(nameMeta(f.n,f.path),{sz:f.sz,m:f.m,mt:f.mt,fn:f.n,ad:e?e.ad:Date.now(),x:0,ix:Date.now()});added++;}}
      for(const id in idx.tracks)if(!seen.has(id)){delete idx.tracks[id];removed++;}
      LIB.idx=idx;rebuildIndex();renderSoon();if(added||removed||!LIB.idx.at)await LIB.save();
      this.last=Date.now();LS.set('lastSync',this.last);
      this.phase=plural(files.length,'canción','canciones')+' en tu Drive'+(added?' · '+plural(added,'nueva','nuevas'):'')+(removed?' · '+plural(removed,'quitada','quitadas'):'');
      if(deep)await this.tags(idx);}
    catch(e){this.phase=e&&e.code==='no_folder'?'No encuentro la carpeta «'+S.cfg.folder+'» en tu Drive. Revisa el nombre en Ajustes de Tu Drive.':e&&e.code==='cancel'?'Parado.':
      e&&(e.code==='auth'||e.code==='no_token')?'Se ha cortado la conexión con Google. Toca Reconectar y sigue.':'Algo ha fallado ('+((e&&(e.status||e.code))||'error')+'). Vuelve a intentarlo.';}
    this.running=false;renderSync();renderSoon();},
  async tags(idx){const todo=Object.keys(idx.tracks).filter(id=>!idx.tracks[id].x);this.total=todo.length;this.done=0;if(!todo.length){return;}
    let since=0;const covers=idx.cv||(idx.cv={});
    const work=async()=>{while(todo.length&&!this.cancel&&AUTH.ok()){const id=todo.shift(),e=idx.tracks[id];if(!e)continue;
      try{const tg=await readTags({id,n:e.fn,mt:e.mt,sz:e.sz});
        if(tg.t)e.t=cleanTitle(tg.t).slice(0,200)||e.t;if(tg.a)e.a=cleanArtist(tg.a)||e.a;if(tg.aa)e.aa=cleanArtist(tg.aa);
        if(tg.al)e.al=tg.al.slice(0,200);if(tg.y)e.y=tg.y;if(tg.g)e.g=tg.g;if(tg.n)e.n=tg.n;if(tg.d>1)e.d=tg.d;if(tg.du)e.du=tg.du;
        if(tg.pic&&tg.pic.data&&tg.pic.data.length>200){const hk=hashStr(String(tg.pic.data.length)+':'+Array.from(tg.pic.data.subarray(0,512)).join(','));
          if(covers[hk])e.c=covers[hk];else{const cb=await coverBlob(tg.pic);if(cb){const cid=await upload('c-'+id+'.jpg',cb);covers[hk]=cid;e.c=cid;}}}
        e.x=1;}catch(err){if(err&&(err.code==='auth'||err.code==='no_token')){todo.unshift(id);break;}e.x=2;}
      e.ix=Date.now();this.done++;since++;this.phase='Leyendo etiquetas y portadas '+this.done+'/'+this.total;renderSyncSoon();
      if(since>=40){since=0;rebuildIndex();renderSoon();await LIB.save().catch(()=>{});}}};
    await Promise.all([work(),work(),work()]);rebuildIndex();await LIB.save().catch(()=>{});
    this.phase=this.cancel?'Parado. Lo leído ya está guardado.':todo.length?'Se cortó la conexión. Lo leído ya está guardado; vuelve a pulsar para seguir.':'Biblioteca al día: '+plural(S.tracks.size,'canción','canciones')+'.';}};
const renderSyncSoon=debounce(()=>renderSync(),300);

function loginCard(){return h('div',{class:'sec'},
  h('div',{class:'lcd',style:'padding:18px 20px'},h('div',{style:'font-size:22px'},'LA GUANTERA'),h('div',{class:'dim',style:'font-size:14px;margin-top:4px'},'Tu música, desde tu Google Drive.')),
  h('p',{class:'sub',style:'margin:0;max-width:60ch'},'Entra con tu cuenta de asturtalent.org. La app solo lee tu música y guarda tus listas en una zona privada de tu Drive.'),
  h('div',{class:'row'},h('button',{class:'pbtn amber','data-act':'login'},'Entrar con Google'),h('button',{class:'pbtn','data-act':'soundTest'},ic('wave'),'Prueba de sonido')));}
ACT.login=()=>{if(!navigator.onLine){toast('Sin conexión');return;}AUTH.request();};
ACT.sync=el=>SYNC.run(el.dataset.deep==='1');
ACT.syncStop=()=>{SYNC.cancel=true;toast('Parando…');};

function viewImport(v){v.append(h('h1',null,'Tu Drive'));
  if(!LS.get('authed',false)){v.append(loginCard());return;}
  v.append(h('div',{id:'syncBox',class:'sec'}));renderSync();
  const fold=h('input',{type:'text',id:'folderName',value:S.cfg.folder,maxlength:'120',autocomplete:'off'});
  v.append(h('div',{class:'sec'},secH('Carpeta de música'),h('div',{class:'row'},h('label',{class:'field',style:'flex:1;min-width:220px;max-width:420px'},h('span',{class:'label'},'Nombre exacto de la carpeta en tu Drive'),fold),
    h('button',{class:'pbtn',style:'align-self:flex-end',onclick:()=>{const n=fold.value.trim();if(!n||n===S.cfg.folder)return;setCfg({folder:n});toast('Carpeta cambiada');SYNC.run(false);}},'Cambiar'))),
    h('div',{class:'note'},h('b',null,'Cómo funciona. '),'«Buscar canciones nuevas» es rápido y gasta poco: añade lo que hayas subido, con el nombre del archivo. «Leer etiquetas y portadas» abre cada canción para sacar artista, álbum, duración y portada; hazlo en el ordenador o con wifi. Lo que leas aquí sirve para todos tus aparatos.'));}
function renderSync(){const box=$('#syncBox');if(!box)return;box.textContent='';const n=S.tracks.size,pend=[...S.tracks.values()].filter(t=>!t.x).length;
  box.append(h('div',{class:'stat-row'},stat(String(n),'canciones en la biblioteca'),stat(String(pend),'sin etiquetas leídas'),stat(SYNC.last?new Date(SYNC.last).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—','última búsqueda')));
  if(SYNC.phase)box.append(h('div',{class:'lcd',style:'padding:12px 16px;font-size:16px;display:flex;flex-direction:column;gap:8px'},SYNC.phase,
    SYNC.running&&SYNC.total?h('div',{class:'bar-meter'},h('i',{style:'width:'+Math.round(SYNC.done/Math.max(1,SYNC.total)*100)+'%'})):null));
  box.append(h('div',{class:'row'},SYNC.running?h('button',{class:'pbtn','data-act':'syncStop'},'Parar'):null,
    !SYNC.running?h('button',{class:'pbtn amber','data-act':'sync','data-deep':'0'},ic('search'),'Buscar canciones nuevas'):null,
    !SYNC.running?h('button',{class:'pbtn','data-act':'sync','data-deep':'1'},ic('dl'),pend?'Leer etiquetas y portadas ('+pend+')':'Revisar etiquetas'):null,
    AUTH.ok()?null:h('button',{class:'pbtn amber','data-act':'login'},'Reconectar')));}

async function onAuth(){renderAll();const was=firstAuth;firstAuth=false;
  if(!S.email){try{const j=await gjson('/about',{fields:'user(emailAddress)'});S.email=j.user.emailAddress;LS.set('email',S.email);}catch{}}
  try{await AD.list();}catch{}
  await Promise.all([SY.pullAll().catch(()=>{}),LIB.pull().catch(()=>{}),loadStats()]);
  if(was){const stale=Date.now()-SYNC.last>15*60e3;if(!LIB.idx||stale)SYNC.run(device&&device.kind==='pc'&&!LIB.idx);}
  DL.sync();if(S.stats)pushStats();renderAll();}

/* ===================== arranque ===================== */
function woodTexture(){const W=512,H=64,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),img=x.createImageData(W,H),d=img.data;
  const R=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);};
  const nz=(px,py)=>{const i=Math.floor(px),j=Math.floor(py),fx=px-i,fy=py-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=R(i,j),b=R(i+1,j),c2=R(i,j+1),d2=R(i+1,j+1);return a+(b-a)*u+(c2-a)*v+(a-b-c2+d2)*u*v;};
  for(let y=0;y<H;y++)for(let X=0;X<W;X++){const n=nz(X/38,y/9)+nz(X/12,y/3)*.35,grain=Math.sin((y/H*7+n*5.5+X/W*1.3)*Math.PI*1.8),burl=nz(X/7,y/7);
    const t=Math.max(0,Math.min(1,.5+.32*grain+.18*(burl-.5))),o=(y*W+X)*4;d[o]=58+t*78;d[o+1]=28+t*40;d[o+2]=14+t*20;d[o+3]=255;}
  x.putImageData(img,0,0);return c.toDataURL('image/jpeg',.82);}
function firstRunSheet(){openSheet(h('h3',null,'¿Dónde estás abriendo La Guantera?'),h('p',{class:'sub',style:'margin:0'},'Así el resumen sabe en qué aparato escuchas, y el coche abre directamente en modo coche.'),
  h('div',{class:'steps'},...Object.entries(KIND).map(([k,o])=>h('button',{class:'pbtn'+(device.kind===k?' amber':''),style:'min-height:64px;font-size:17px',onclick:()=>{
    device.kind=k;device.name=o.name;LS.set('dev',device);closeLayer();
    if(k==='car'){prefs.carStart=true;savePrefs();carOn();}else if(document.body.classList.contains('carmode'))carOff();renderAll();}},ic(o.icon),o.name))));}
(function(){const hs=location.hash;if(!/access_token=|error=/.test(hs))return;const p=new URLSearchParams(hs.slice(1));let ok=true;try{ok=p.get('state')===sessionStorage.getItem('lg.st');}catch{}
  history.replaceState(null,'',location.pathname);if(p.get('access_token')&&ok)setTimeout(()=>AUTH.done({access_token:p.get('access_token'),expires_in:p.get('expires_in')}),0);
  else if(p.get('error'))setTimeout(()=>toast('Google no ha dado acceso ('+p.get('error')+').',5000),500);})();
async function boot(){try{document.documentElement.style.setProperty('--wood-img','url('+woodTexture()+')');}catch{}
  $$('[data-knob]').forEach(bindKnob);
  if(!device){device={id:rid(8),kind:guessKind()};device.name=KIND[device.kind].name;LS.set('dev',device);S.firstRun=true;}
  const hv=location.hash.slice(1);if(VIEWS.includes(hv))S.view=hv;
  renderNav();renderView(true);renderPlayer(true);renderDials();renderPresets();requestAnimationFrame(specLoop);
  if(hv==='coche'||prefs.carStart||(S.firstRun&&device.kind==='car'))carOn();
  await Promise.all([SY.loadLocal(),LIB.loadLocal()]);
  try{const st=await IDB.get('kv','stats');if(st&&st.ym===ym()&&st.dev===device.id){S.stats=st;S.statsId=statsName();}}catch{}
  DL.init();renderAll();if(AUTH.ok())onAuth();
  if(S.firstRun)setTimeout(firstRunSheet,700);
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});}
boot();
