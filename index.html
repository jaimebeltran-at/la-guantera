<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>La Guantera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=DotGothic16&family=Marcellus&display=swap">
<style>
/* Salpicadero de un C220 de 2001 de noche: antracita, cromo satinado, nogal y la luz naranja del cuadro.
   Una sola apariencia oscura a propósito. Escritorio: barra lateral + contenido + frontal de radio abajo.
   Móvil: contenido + mini frontal + pestañas. Coche: pantalla propia a toda pantalla. */
:root{
  color-scheme: dark;
  --bg:#111214; --bg-2:#15171a; --panel:#1b1d21; --panel-2:#23262b; --line:#32363c; --line-2:#08090a;
  --fg:#ebe6dc; --fg-2:#bdb7ab; --muted:#8c877d;
  --amber:#ff9a2e; --amber-hi:#ffc37c; --amber-lo:#6e3f12; --amber-glow:rgba(255,154,46,.42);
  --lcd:#0a0908;
  --chrome-a:#f4f4f1; --chrome-b:#aeb1b5; --chrome-c:#63676d;
  --wood-a:#4b2515; --wood-b:#7d4224; --wood-c:#2b130a;
  --bad:#e3654f; --good:#a3c985;
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-ui:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-lcd:"DotGothic16","VT323",ui-monospace,Menlo,monospace;
  --wood-img:none;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:var(--amber-hi)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}

/* ---------- materiales ---------- */
.plastic{background:radial-gradient(140% 90% at 50% -20%,#24272c 0,#191b1f 55%,#141518 100%)}
.wood{background:var(--wood-img),linear-gradient(90deg,var(--wood-c),var(--wood-b) 30%,var(--wood-a) 55%,var(--wood-b) 80%,var(--wood-c));background-size:cover;position:relative}
.wood::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,240,220,.22),rgba(255,240,220,0) 45%,rgba(0,0,0,.25));pointer-events:none}
.chrome{background:linear-gradient(180deg,var(--chrome-a) 0,#d4d6d8 20%,#8f9398 52%,#bfc2c5 78%,var(--chrome-c) 100%);color:#17181a;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.35),0 2px 5px rgba(0,0,0,.6)}
.lcd{background:radial-gradient(130% 140% at 50% 0%,rgba(255,154,46,.07),transparent 60%),var(--lcd);color:var(--amber);font-family:var(--f-lcd);text-shadow:0 0 6px var(--amber-glow);border-radius:6px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #000,inset 0 3px 10px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.06)}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.45) 1px,transparent 1px);background-size:3px 3px;opacity:.5}
.lcd .dim{color:var(--amber-lo);text-shadow:none}
.led{width:6px;height:6px;border-radius:50%;background:#3b2a19;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);flex:none}
.on>.led,.led.on{background:var(--amber);box-shadow:0 0 6px var(--amber),0 0 2px var(--amber-hi)}
.label{font:600 11px/1.2 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- botones ---------- */
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;background:linear-gradient(#2c2f34,#1d1f23);border:1px solid #0b0c0e;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.6);font-weight:600;font-size:14px;color:var(--fg)}
.pbtn:hover{background:linear-gradient(#33373d,#22252a)}
.pbtn:active,.pbtn.on{box-shadow:inset 0 2px 5px rgba(0,0,0,.85);background:linear-gradient(#1c1e22,#24272c)}
.pbtn.on{color:var(--amber-hi)}
.pbtn.amber{background:linear-gradient(#ffb251,#e9831c);color:#1d1206;border-color:#5a3108;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 14px rgba(255,154,46,.25)}
.pbtn.ghost{background:none;border-color:var(--line);box-shadow:none}
.pbtn[disabled]{opacity:.45;cursor:default}
.ibtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--fg-2)}
.ibtn:hover{color:var(--fg);background:rgba(255,255,255,.05)}
.ibtn.on{color:var(--amber)}
.round{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.round.big{width:60px;height:60px}
.round.chrome:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(0,0,0,.45)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.chip:hover{border-color:#4a4f57;color:var(--fg)}
.chip.on{border-color:var(--amber);color:var(--amber-hi)}

/* ---------- estructura ---------- */
.app{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"side main" "deck deck"}
.side{grid-area:side;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:18px;padding:18px 14px 14px var(--gut-l);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand b{font:400 22px/1 var(--f-display);letter-spacing:.03em}
.brand .badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:8px;color:var(--fg-2);font-weight:500;text-align:left}
.nav button:hover{background:rgba(255,255,255,.04);color:var(--fg)}
.nav button.on{color:var(--fg);background:linear-gradient(90deg,rgba(255,154,46,.12),transparent)}
.nav button.on svg{color:var(--amber)}
.side .lists{display:flex;flex-direction:column;gap:1px}
.side .lists button{text-align:left;padding:7px 10px;border-radius:6px;color:var(--fg-2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .lists button:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.main{grid-area:main;overflow:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.view{padding:22px var(--gut-r) 40px var(--gut-l);max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.tabs{display:none}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;line-height:1.1}
h2{font-size:22px}
h3{font-size:18px}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;gap:12px}
.sec-h .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.card .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
.cover{aspect-ratio:1;width:100%;max-width:100%;border-radius:6px;overflow:hidden;position:relative;background:#2a2c30;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.45);display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{font:400 30px/1 var(--f-display);color:rgba(255,245,230,.85);text-align:center;padding:10px;letter-spacing:.04em}
.cover .ph small{display:block;font:600 9px/1.3 var(--f-ui);letter-spacing:.2em;margin-top:8px;opacity:.75}
.card:hover .cover{box-shadow:0 0 0 1px var(--amber-lo),0 8px 20px rgba(0,0,0,.5)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}

/* filas de canciones */
.tracks{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto auto;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;min-height:56px}
.tr:hover{background:rgba(255,255,255,.035)}
.tr.cur{background:rgba(255,154,46,.07)}
.tr.cur .tt{color:var(--amber-hi)}
.tr .cv{width:44px;height:44px;border-radius:4px;overflow:hidden;background:#2a2c30;display:grid;place-items:center;font:400 15px var(--f-display);color:rgba(255,245,230,.8)}
.tr .cv img{width:100%;height:100%;object-fit:cover}
.tr .meta{min-width:0;text-align:left}
.tr .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .du{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tr .dl{color:var(--amber);display:inline-flex}
.more{align-self:center;margin-top:8px}

/* cabecera de detalle */
.hero{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:end}
.hero .cover{width:200px}
.hero .info{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero h1{font-size:40px;overflow-wrap:anywhere}
.presets-pick{display:flex;gap:6px}
.presets-pick button{width:34px;height:34px;border-radius:6px;font-weight:700}

/* ---------- frontal de radio (abajo) ---------- */
.deck{grid-area:deck;position:relative;border-top:1px solid #000}
.deck .trim{height:7px}
.deck-in{display:grid;grid-template-columns:minmax(260px,1.3fr) auto minmax(220px,1fr) auto;align-items:center;gap:18px;padding:12px var(--gut-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.disp{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 12px 8px 8px;min-width:0;cursor:pointer;text-align:left}
.disp .cv{width:52px;height:52px;border-radius:4px;overflow:hidden;background:#1b1610;display:grid;place-items:center;color:var(--amber-lo);font-family:var(--f-display)}
.disp .cv img{width:100%;height:100%;object-fit:cover;opacity:.92}
.mq{white-space:nowrap;overflow:hidden;min-width:0;font-size:17px;line-height:1.3}
.mq>span{display:inline-block}
.mq.run>span{animation:mq var(--mqd,12s) linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.disp .l2{font-size:13px;opacity:.8}
.disp .tm{font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.disp .tm small{display:block;font-size:11px}
.ctl{display:flex;align-items:center;gap:10px}
.ctl .ibtn{position:relative}
.ctl .ibtn .led{position:absolute;bottom:3px;left:50%;margin-left:-3px}
.right{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.presets{display:flex;gap:5px}
.presets button{padding:0;min-height:0;width:38px;height:34px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 13px/1 var(--f-ui)}
.presets button .led{width:5px;height:5px}

/* dial de sintonía = barra de progreso */
.dial{position:relative;height:38px;border-radius:5px;background:linear-gradient(#0c0b09,#13110d);box-shadow:inset 0 0 0 1px #000,inset 0 2px 6px rgba(0,0,0,.8);cursor:pointer;touch-action:none;overflow:hidden;min-width:0}
.dial .ticks{position:absolute;left:8px;right:8px;top:6px;height:9px;background:repeating-linear-gradient(90deg,rgba(235,226,210,.45) 0 1px,transparent 1px 10px)}
.dial .ticks::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(235,226,210,.75) 0 1px,transparent 1px 50px);height:14px;top:-2px}
.dial .nums{position:absolute;left:8px;right:8px;bottom:4px;height:12px;font:500 10px/12px var(--f-ui);color:rgba(235,226,210,.6);font-variant-numeric:tabular-nums}
.dial .nums span{position:absolute;transform:translateX(-50%)}
.dial .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,154,46,0),rgba(255,154,46,.12));pointer-events:none}
.dial .needle{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;background:var(--amber);box-shadow:0 0 8px var(--amber),0 0 2px var(--amber-hi);border-radius:1px;pointer-events:none}
.dial .lab{position:absolute;right:10px;top:3px;font:600 8px/1 var(--f-ui);letter-spacing:.2em;color:rgba(235,226,210,.45)}

/* rueda de volumen */
.knob{width:46px;height:46px;border-radius:50%;position:relative;flex:none;touch-action:none;cursor:grab;background:repeating-conic-gradient(from 0deg,#9a9da1 0 4deg,#d9dbdd 4deg 8deg);box-shadow:0 3px 6px rgba(0,0,0,.65),inset 0 0 0 1px rgba(0,0,0,.4)}
.knob::before{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fafaf8,#b7babe 45%,#7d8186 100%);box-shadow:inset 0 1px 2px rgba(255,255,255,.7),inset 0 -2px 3px rgba(0,0,0,.35)}
.knob i{position:absolute;inset:0;transform:rotate(var(--a,0deg))}
.knob i::after{content:"";position:absolute;left:50%;top:9px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber)}

/* espectro */
canvas.spec{display:block;width:100%;height:100%}

/* ---------- ahora suena ---------- */
.np{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,#23201b 0,#141416 55%,#0e0f10 100%);padding:calc(12px + env(safe-area-inset-top,0px)) var(--gut-r) calc(16px + env(safe-area-inset-bottom,0px)) var(--gut-l);overflow:auto}
.np-top{display:flex;align-items:center;gap:10px}
.np-body{flex:1;display:grid;grid-template-columns:minmax(0,420px) minmax(0,520px);justify-content:center;align-items:center;gap:40px;padding:18px 0}
.np .bigcover{width:100%;max-width:420px;aspect-ratio:1;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px #000,0 0 0 4px #2a2c30,0 0 0 5px #000,0 24px 60px rgba(0,0,0,.6);background:#2a2c30;display:grid;place-items:center;justify-self:center}
.np .bigcover img{width:100%;height:100%;object-fit:cover}
.np-panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.np .lcd.big{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.np .lcd.big .mq{font-size:24px}
.np .lcd.big .l2{font-size:15px}
.np .lcd.big .row{justify-content:space-between;font-size:14px}
.np .lcd .spec-wrap{height:46px;margin-top:6px}
.np .dial{height:46px}
.np-ctl{display:flex;align-items:center;justify-content:center;gap:16px}
.np-ctl .ibtn{position:relative;width:48px;height:48px}
.np-ctl .ibtn .led{position:absolute;bottom:4px;left:50%;margin-left:-3px}
.np-row2{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* ---------- modo coche ---------- */
.car{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:12px;overflow:hidden;padding:calc(10px + env(safe-area-inset-top,0px)) var(--gut-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut-l);background:radial-gradient(140% 100% at 50% 0%,#1d1f23,#0f1012 70%)}
.car>*{flex:none;min-width:0}
.car .trim{height:10px;border-radius:3px}
.car>.car-main{flex:1 1 0;min-height:0;display:flex;gap:16px}
.car .cvbox{width:min(34vh,28vw);height:min(34vh,28vw);flex:none;border-radius:6px;overflow:hidden;background:#1b1610;display:grid;place-items:center;box-shadow:0 0 0 1px #000,0 0 0 3px #2a2c30}
.car .cvbox img{width:100%;height:100%;object-fit:cover}
.car .cvbox .ph,.np .bigcover .ph{font:400 clamp(40px,9vh,72px)/1 var(--f-display);color:rgba(255,245,230,.85);text-align:center}
.car .lcd.huge{flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.car .lcd.huge .mq{font-size:34px;line-height:1.25}
.car .lcd.huge .l2{font-size:20px}
.car .lcd.huge .stat{display:flex;justify-content:space-between;font-size:18px;align-items:center}
.car .lcd .spec-wrap{flex:1;min-height:30px}
.car .dial{height:52px}
.car-ctl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.car-ctl button{height:76px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 13px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase}
.car-ctl button svg.i{width:30px;height:30px}
.car-ctl .play svg.i{width:38px;height:38px}
.car-pre{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.car-pre button{height:62px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 6px;min-width:0}
.car-pre b{font:700 20px/1 var(--f-ui)}
.car-pre span{font-size:12px;color:var(--fg-2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car-pre .led{margin-top:1px}
.car-bar{display:flex;gap:10px;justify-content:space-between;align-items:center}
.car-bar .pbtn{min-height:48px;font-size:15px}
.car.lite .lcd::after{display:none}

/* ---------- hojas, menús, avisos ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:86%;overflow:auto;background:var(--panel);border:1px solid #000;border-bottom:0;border-radius:14px 14px 0 0;padding:18px var(--gut-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
@media (min-width:900px){.scrim{align-items:center}.sheet{border-radius:14px;border-bottom:1px solid #000}}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 6px;border-radius:8px;text-align:left;font-weight:500}
.menu button:hover{background:rgba(255,255,255,.05)}
.menu button.bad{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text],.field input[type=search],.search input{height:46px;border-radius:10px;border:1px solid var(--line);background:#121315;padding:0 14px;font-size:16px;width:100%}
.field input:focus,.search input:focus{border-color:var(--amber);outline:none}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#0b0a08;color:var(--amber-hi);font-family:var(--f-lcd);padding:10px 16px;border-radius:8px;box-shadow:0 0 0 1px #000,0 8px 24px rgba(0,0,0,.6);max-width:calc(100% - 32px);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.note{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg-2);color:var(--fg-2);font-size:14px}
.note b{color:var(--fg)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.step .n{font:400 13px var(--f-lcd);color:var(--amber)}
.bar-meter{height:8px;border-radius:4px;background:#0c0b09;box-shadow:inset 0 0 0 1px #000;overflow:hidden}
.bar-meter i{display:block;height:100%;background:linear-gradient(90deg,var(--amber-lo),var(--amber));border-radius:4px}

/* importación */
.imp-list{display:flex;flex-direction:column;gap:2px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.imp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:6px 8px;font-size:13px;border-radius:6px}
.imp-row .st{color:var(--muted);font-variant-numeric:tabular-nums}
.imp-row.ok .st{color:var(--good)}
.imp-row.err .st{color:var(--bad)}
.imp-row.run .st{color:var(--amber)}
.drop{border:1.5px dashed #4a4f57;border-radius:12px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.drop.over{border-color:var(--amber);background:rgba(255,154,46,.05)}

/* ecualizador */
.eq{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:14px 10px 10px;border-radius:10px}
.eq label{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 11px var(--f-ui);color:var(--fg-2)}
.eq output{font:400 12px var(--f-lcd);color:var(--amber)}
.eq input[type=range]{writing-mode:vertical-lr;direction:rtl;height:150px;width:30px;accent-color:var(--amber);cursor:pointer}

/* resumen */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{padding:16px;border-radius:10px;display:flex;flex-direction:column;gap:4px}
.stat .v{font:400 34px/1.1 var(--f-lcd);color:var(--amber);text-shadow:0 0 6px var(--amber-glow)}
.stat .k{font-size:13px;color:var(--fg-2)}
.rank{display:flex;flex-direction:column;gap:8px;counter-reset:r}
.rank .it{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center}
.rank .it::before{counter-increment:r;content:counter(r);font:400 14px var(--f-lcd);color:var(--amber)}
.rank .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .vv{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;align-items:end;height:120px;padding:10px;border-radius:8px}
.hours i{display:block;background:var(--amber);border-radius:2px 2px 0 0;min-height:2px;opacity:.9}
.hours i:hover{opacity:1;box-shadow:0 0 8px var(--amber)}
.hours-x{display:grid;grid-template-columns:repeat(4,1fr);font-size:11px;color:var(--muted);padding:0 10px}
.tip{position:fixed;z-index:70;pointer-events:none;background:#0b0a08;color:var(--fg);border:1px solid #000;border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 6px 16px rgba(0,0,0,.6)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}

/* ---------- móvil ---------- */
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"main" "deck" "tabs"}
  .side{display:none}
  .tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(5,1fr);background:#0e0f11;border-top:1px solid #000;padding:4px var(--gut-r) calc(4px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
  .tabs button.on{color:var(--amber)}
  .deck .trim{height:4px}
  .deck-in{grid-template-columns:minmax(0,1fr) auto;padding:6px var(--gut-r) 6px var(--gut-l);gap:8px}
  .deck-in .dialbox,.deck-in .right{display:none}
  .deck-in .ctl .hide-m{display:none}
  .disp{grid-template-columns:44px minmax(0,1fr);padding:6px 10px 6px 6px}
  .disp .cv{width:44px;height:44px}
  .disp .tm{display:none}
  .mq{font-size:15px}
  .deck .prog{position:absolute;left:0;right:0;top:0;height:2px;background:transparent}
  .deck .prog i{display:block;height:100%;background:var(--amber);box-shadow:0 0 6px var(--amber)}
  .view{padding-top:16px;gap:22px}
  h1{font-size:28px}
  .hero{grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
  .hero .cover{width:120px}
  .hero h1{font-size:26px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
  .hscroll{grid-auto-columns:132px}
  .tr{grid-template-columns:44px minmax(0,1fr) auto auto;gap:10px}
  .tr .du{display:none}
  .np-body{grid-template-columns:minmax(0,1fr);gap:18px;align-content:start}
  .np .bigcover{max-width:min(340px,78vw)}
  .np .lcd.big .mq{font-size:20px}
}
@media (min-width:900px){ .deck .prog{display:none} }
@media (max-height:520px) and (min-width:700px){ .car{gap:8px} .car-ctl button{height:60px} .car-pre button{height:50px} .car .lcd.huge .mq{font-size:28px} .car .cvbox{width:min(30vh,24vw);height:min(30vh,24vw)} }
@media (prefers-reduced-motion:reduce){ .mq.run>span{animation:none} *{scroll-behavior:auto!important} }

"use strict";
/* ===================== utilidades ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,props,...kids){const el=document.createElement(tag);if(props)for(const k in props){const v=props[k];if(v==null||v===false)continue;if(k==='class')el.className=v;else if(k==='text')el.textContent=v;else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);else if(k==='style')el.style.cssText=v;else el.setAttribute(k,v===true?'':v);}for(const c of kids.flat(9)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}return el;}
const SVGNS='http://www.w3.org/2000/svg';
function ic(name,style){const s=document.createElementNS(SVGNS,'svg');s.setAttribute('class','i');if(style)s.setAttribute('style',style);const u=document.createElementNS(SVGNS,'use');u.setAttribute('href','#i-'+name);s.append(u);return s;}
function setIc(svg,name){const u=svg&&svg.querySelector('use');if(u)u.setAttribute('href','#i-'+name);}
const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);const H=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return H?H+':'+String(m).padStart(2,'0')+':'+x:m+':'+x;};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const rid=(n=10)=>{const a=crypto.getRandomValues(new Uint8Array(n));let s='';for(const b of a)s+='abcdefghijklmnopqrstuvwxyz0123456789'[b%36];return s;};
function hashStr(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return x>>>0;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
async function until(fn,ms){const end=Date.now()+ms;while(!fn()&&Date.now()<end)await sleep(120);return fn();}
const coll=new Intl.Collator('es',{sensitivity:'base',numeric:true});
const ym=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(msg,ms=2800){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms);}
const LS={get(k,d){try{const v=localStorage.getItem('lg.'+k);return v==null?d:JSON.parse(v);}catch{return d;}},set(k,v){try{localStorage.setItem('lg.'+k,JSON.stringify(v));}catch{}}};
const plural=(n,a,b)=>n+' '+(n===1?a:b);
const mins=s=>{const m=Math.round((s||0)/60);return m<60?m+' min':(m/60).toFixed(m<600?1:0).replace('.',',')+' h';};
const AUDIO_EXT=/\.(mp3|m4a|aac|flac|ogg|oga|opus|wav|webm|mp4)$/i;
const C={room:null};

/* ===================== almacén local (IndexedDB) ===================== */
const IDB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{let r;try{r=indexedDB.open('guantera-drive',1);}catch(e){return rej(e);}
    r.onupgradeneeded=()=>{for(const s of ['audio','covers','kv'])if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s);};
    r.onsuccess=()=>{this.db=r.result;res(r.result);};r.onerror=()=>rej(r.error);});},
  async req(st,mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  get(st,k){return this.req(st,'readonly',s=>s.get(k));},put(st,k,v){return this.req(st,'readwrite',s=>s.put(v,k));},
  del(st,k){return this.req(st,'readwrite',s=>s.delete(k));},keys(st){return this.req(st,'readonly',s=>s.getAllKeys());}};

/* ===================== portadas (desde tu Drive, guardadas en el aparato) ===================== */
const PH=['#5b2a1c','#1f3a33','#2b3550','#4a3a1d','#3d2340','#24413f','#5a4632','#3a3d43'];
const initials=t=>{const w=String(t||'?').replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/);return(((w[0]||'?')[0]||'?')+((w[1]||'')[0]||'')).toUpperCase();};
const COV={mem:new Map(),pend:new Map(),q:[],active:0,
  url(cid){if(this.mem.has(cid))return Promise.resolve(this.mem.get(cid));if(this.pend.has(cid))return this.pend.get(cid);
    const p=(async()=>{let b=null;try{b=await IDB.get('covers',cid);}catch{}
      if(!b){if(!AUTH.ok()||!navigator.onLine)return null;await this.slot();try{b=await(await gfetch(G+'/files/'+cid+'?alt=media')).blob();IDB.put('covers',cid,b).catch(()=>{});}catch{return null;}finally{this.release();}}
      const u=URL.createObjectURL(b);this.mem.set(cid,u);return u;})();
    this.pend.set(cid,p);p.finally(()=>this.pend.delete(cid)).catch(()=>{});return p;},
  slot(){if(this.active<4){this.active++;return Promise.resolve();}return new Promise(r=>this.q.push(r));},
  release(){const n=this.q.shift();if(n)n();else this.active--;}};
const covIO='IntersectionObserver' in window?new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){covIO.unobserve(e.target);loadCover(e.target);}},{rootMargin:'400px'}):null;
function loadCover(box){const cid=box.dataset.cid;if(!cid)return;COV.url(cid).then(u=>{if(u&&box.dataset.cid===cid){box.textContent='';box.append(h('img',{src:u,alt:'',decoding:'async'}));}}).catch(()=>{});}
function fillCover(box,cid,title,sub){box.textContent='';const col=PH[hashStr(norm(title))%PH.length];box.style.background='linear-gradient(135deg,'+col+',#15161a)';
  if(cid&&COV.mem.has(cid)){box.dataset.cid=cid;box.append(h('img',{src:COV.mem.get(cid),alt:'',decoding:'async'}));return box;}
  box.append(h('span',{class:'ph'},initials(title),sub?h('small',null,sub):null));
  if(cid){box.dataset.cid=cid;if(covIO)covIO.observe(box);else loadCover(box);}else delete box.dataset.cid;return box;}
const coverEl=(cid,title,sub,cls='cover')=>fillCover(h('div',{class:cls}),cid,title,sub);

/* ===================== aparato y preferencias ===================== */
const KIND={car:{name:'Coche',icon:'car'},phone:{name:'Móvil',icon:'phone'},pc:{name:'Ordenador',icon:'laptop'}};
let device=LS.get('dev',null);
function guessKind(){const coarse=matchMedia('(pointer:coarse)').matches;const w=innerWidth,hh=innerHeight;if(!coarse)return'pc';if(w>hh&&w>=880&&hh<=820)return'car';return'phone';}
const prefs=Object.assign({fx:true,xf:4,eq:'w203',gains:null,level:false,viz:true,vol:.85,radio:true},LS.get('prefs',{}));

async function gfetch(url,opt={},wait=false){const tok=await AUTH.get(wait);
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt.headers,{Authorization:'Bearer '+tok})}));
  if(r.status===401){AUTH.token=null;AUTH.exp=0;LS.set('tok',null);renderSoon();throw Object.assign(new Error('auth'),{code:'auth'});}
  if(!r.ok)throw Object.assign(new Error('HTTP '+r.status),{code:'http',status:r.status});return r;}

      const j=await gjson('/files',p);for(const f of j.files)if(!out[f.name]||f.modifiedTime>out[f.name].modifiedTime)out[f.name]=f;pt=j.nextPageToken;}while(pt);this.ids=out;return out;},

function rebuildIndex(){
  const src=(LIB.idx&&LIB.idx.tracks)||{};const tracks=new Map();
  for(const id in src){const e=src[id];if(e)tracks.set(id,Object.assign({},e,{id,f:e.m||'1',c:e.c||''}));}
  const al=new Map(),ar=new Map();
  for(const t of tracks.values()){
    const artist=t.aa||t.a||'Artista desconocido';const ak=norm(artist)+'|'+norm(t.al||'');
    let A=al.get(ak);if(!A){A={id:'a'+hashStr(ak).toString(36),title:t.al||'Sencillos',artist,year:t.y||'',cover:t.c||'',ids:[]};al.set(ak,A);}
    A.ids.push(t.id);if(!A.cover&&t.c)A.cover=t.c;if(!A.year&&t.y)A.year=t.y;
    const rk=norm(artist);let R=ar.get(rk);if(!R){R={id:'r'+hashStr(rk).toString(36),name:artist,ids:[],albums:[],cover:''};ar.set(rk,R);}
    R.ids.push(t.id);if(!R.albums.includes(A.id))R.albums.push(A.id);if(!R.cover&&t.c)R.cover=t.c;t.alId=A.id;t.arId=R.id;}
  const byNo=(x,y)=>{const a=tracks.get(x),b=tracks.get(y);return(a.d||1)-(b.d||1)||(a.n||999)-(b.n||999)||coll.compare(a.t||'',b.t||'');};

  S.albums=[...al.values()].sort((a,b)=>coll.compare(a.artist,b.artist)||String(a.year).localeCompare(String(b.year))||coll.compare(a.title,b.title));

  S.artists=[...ar.values()].sort((a,b)=>coll.compare(a.name,b.name));S.artistById=new Map(S.artists.map(a=>[a.id,a]));
  for(const R of S.artists){R.albums.sort((x,y)=>String(S.albumById.get(x).year).localeCompare(String(S.albumById.get(y).year)));R.ids=R.albums.flatMap(aid=>S.albumById.get(aid).ids);}
  S.tracks=tracks;S.allIds=[...tracks.keys()].sort((x,y)=>coll.compare(tracks.get(x).t||'',tracks.get(y).t||''));
  S.recentIds=[...tracks.values()].sort((a,b)=>(b.ad||0)-(a.ad||0)).map(t=>t.id);}

const DL={busy:false,left:0,
  async init(){try{const ks=await IDB.keys('audio');ks.forEach(k=>S.dl.add(k));S.dlOk=true;}catch{S.dlOk=false;}

function recordListen(t,secs){if(!device||!t||t.test||secs<5)return;const n=statsName();
  if(S.statsId!==n){S.stats=null;S.statsId=n;}
  const st=S.stats||(S.stats={ym:ym(),dev:device.id,total:0,plays:{},secs:{},art:{},hrs:{},days:{},recent:[]});
  st.dn=device.name;st.dk=device.kind;secs=Math.round(secs);st.total+=secs;st.secs[t.id]=(st.secs[t.id]||0)+secs;
  const counted=secs>=30||(t.du&&secs>=t.du*.5);if(counted)st.plays[t.id]=(st.plays[t.id]||0)+1;
  const art=t.aa||t.a||'?';st.art[art]=(st.art[art]||0)+secs;const d=new Date();

  if(counted){st.recent.unshift([t.id,Date.now()]);st.recent=st.recent.slice(0,40);}
  IDB.put('kv','stats',st).catch(()=>{});pushStats();}

<script>
"use strict";
/* ===================== motor de audio: dos platinas para fundir, ecualizador de 5 bandas ===================== */
const EQF=[60,250,1000,4000,12000];
const EQP={plano:{nm:'Plano',g:[0,0,0,0,0]},w203:{nm:'Coche W203',g:[3,-1,0,1.5,2.5]},sonoridad:{nm:'Sonoridad',g:[5,1,0,1,4]},
  voz:{nm:'Voz',g:[-3,0,2,3,0]},rock:{nm:'Rock',g:[4,-1,-1,2,3]},noche:{nm:'Noche',g:[4,0,-1,0,3]}};
const TESTURLS=new Set();
const AE={decks:[$('#deckA'),$('#deckB')],cur:0,ctx:null,n:null,xf:false,urls:[null,null],xfTimer:0,errs:0,
  get el(){return this.decks[this.cur];},
  gains(){return prefs.gains||(EQP[prefs.eq]||EQP.plano).g;},
  ensure(){if(!prefs.fx||this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const ctx=new AC({latencyHint:'playback'});const srcs=this.decks.map(d=>ctx.createMediaElementSource(d));const dg=this.decks.map(()=>ctx.createGain());
      srcs.forEach((s,i)=>s.connect(dg[i]));
      const bands=EQF.map((f,i)=>{const b=ctx.createBiquadFilter();b.type=i===0?'lowshelf':i===EQF.length-1?'highshelf':'peaking';b.frequency.value=f;b.Q.value=.9;return b;});
      dg.forEach(g=>g.connect(bands[0]));for(let i=0;i<bands.length-1;i++)bands[i].connect(bands[i+1]);
      const comp=ctx.createDynamicsCompressor(),mg=ctx.createGain(),an=ctx.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.78;
      bands[bands.length-1].connect(comp);comp.connect(mg);mg.connect(an);an.connect(ctx.destination);
      this.ctx=ctx;this.n={dg,bands,comp,mg,an};dg[this.cur].gain.value=1;dg[1-this.cur].gain.value=0;this.decks.forEach(d=>d.volume=1);
      this.applyEq();this.applyLevel();this.applyVol();
    }catch(e){console.warn('audio',e);this.ctx=null;this.n=null;}},
  applyEq(){if(!this.n)return;const g=this.gains();this.n.bands.forEach((b,i)=>b.gain.setTargetAtTime(g[i]||0,this.ctx.currentTime,.05));},
  applyLevel(){if(!this.n)return;const c=this.n.comp,on=prefs.level||prefs.eq==='noche';c.threshold.value=on?-26:0;c.knee.value=on?24:0;c.ratio.value=on?4:1;c.attack.value=.005;c.release.value=.25;this.applyVol();},
  applyVol(){const v=prefs.vol;if(this.n)this.n.mg.gain.setTargetAtTime(v*v*((prefs.level||prefs.eq==='noche')?1.6:1),this.ctx.currentTime,.03);else this.decks.forEach(d=>d.volume=Math.min(1,v*v));},
  async resume(){this.ensure();if(this.ctx&&this.ctx.state!=='running'){try{await this.ctx.resume();}catch{}}},
  setLevel(i,v,ramp){if(!this.n)return;const g=this.n.dg[i].gain,t=this.ctx.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);if(ramp)g.linearRampToValueAtTime(v,t+ramp);else g.setValueAtTime(v,t);}};

/* audio desde Drive: se baja la canción entera (unos segundos) y se dejan preparadas las siguientes */
const BL={mem:new Map(),inflight:new Map(),
  get(t,wait){if(this.mem.has(t.id))return Promise.resolve(this.mem.get(t.id));if(this.inflight.has(t.id))return this.inflight.get(t.id);
    const p=(async()=>{const b=await(await gfetch(G+'/files/'+t.id+'?alt=media',{},wait)).blob();this.mem.set(t.id,b);
      while(this.mem.size>8){const k=[...this.mem.keys()].find(k=>k!==(P.current&&P.current.id));this.mem.delete(k);}return b;})();
    this.inflight.set(t.id,p);p.finally(()=>this.inflight.delete(t.id)).catch(()=>{});return p;},
  prefetch(n){if(!AUTH.ok()||!navigator.onLine)return;const ids=[];for(let i=1;i<=n;i++){const id=P.q[P.qi+i];if(id)ids.push(id);}
    (async()=>{for(const id of ids){const t=getTrack(id);if(!t||t.test||S.dl.has(id)||this.mem.has(id))continue;try{await this.get(t,false);}catch{break;}}})();}};
async function srcFor(t){if(t.test)return t.url;
  if(S.dl.has(t.id)){try{const rec=await IDB.get('audio',t.id);if(rec&&rec.b)return URL.createObjectURL(rec.b);}catch{}}
  if(!navigator.onLine&&!BL.mem.has(t.id))throw Object.assign(new Error('offline'),{code:'offline'});
  S.loading=t.id;renderPlayer();
  try{return URL.createObjectURL(await BL.get(t,true));}finally{if(S.loading===t.id){S.loading=null;renderPlayer();}}}
function setDeckSrc(i,url){const old=AE.urls[i];if(old&&old.startsWith('blob:')&&!TESTURLS.has(old)&&old!==url)URL.revokeObjectURL(old);AE.urls[i]=url;AE.decks[i].src=url;}

/* ===================== cola y reproducción ===================== */
const P={q:[],orig:null,qi:-1,shuffle:false,repeat:'off',src:'',
  get current(){return getTrack(this.q[this.qi]);},
  nextIdx(auto){if(auto&&this.repeat==='one')return this.qi;if(this.qi+1<this.q.length)return this.qi+1;if(this.repeat!=='off'&&this.q.length)return 0;return null;},
  async play(ids,start=0,src='',o={}){ids=ids.filter(id=>getTrack(id));if(!ids.length)return;
    if(S.ctrl)return remoteCmd({op:'play',ids:ids.slice(0,150),start:Math.max(0,Math.min(start,149)),src,sh:o.shuffle});
    if(o.shuffle!==undefined)this.shuffle=o.shuffle;
    if(start<0||start>=ids.length)start=this.shuffle?Math.floor(Math.random()*ids.length):0;
    this.orig=ids.slice();this.src=src;
    if(this.shuffle){const first=ids[start];this.q=[first,...shuffleArr(ids.filter((_,i)=>i!==start))];await this.load(0);}
    else{this.q=ids.slice();await this.load(start);}},
  async load(i,{autoplay=true,pos=0}={}){endListen();if(AE.xf)cancelXf();
    this.qi=i;const t=this.current;if(!t)return;onTrackChange();let url;
    try{url=await srcFor(t);}catch(e){if(this.current!==t)return;AE.errs++;
      toast(e.code==='offline'?'Sin conexión y «'+(t.t||'')+'» no está descargada':e.code==='no_token'||e.code==='auth'?'Toca la pantalla para reconectar con Google':'No se pudo cargar «'+(t.t||'')+'»');
      if(e.code!=='no_token'&&e.code!=='auth'&&AE.errs<4&&this.qi+1<this.q.length)setTimeout(()=>{if(this.current===t)this.load(this.qi+1);},1200);else AE.errs=0;renderPlayer();return;}
    if(this.current!==t)return;
    setDeckSrc(AE.cur,url);
    if(pos>0){const d=AE.el,once=()=>{try{d.currentTime=pos;}catch{}d.removeEventListener('loadedmetadata',once);};d.addEventListener('loadedmetadata',once);}
    startListen(t);renderPlayer();saveState();if(autoplay)await this.resume();},
  async resume(){if(S.ctrl)return remoteCmd({op:'play1'});if(!this.current)return this.toggle();await AE.resume();
    try{await AE.el.play();}catch(e){if(e&&e.name==='NotAllowedError')toast('Toca ▶ para empezar');else if(e&&e.name!=='AbortError'){console.warn(e);}}},
  pause(){if(S.ctrl)return remoteCmd({op:'pause'});AE.decks.forEach(d=>d.pause());},
  async toggle(){if(S.ctrl)return remoteCmd({op:'toggle'});
    if(!this.current){const ids=S.allIds.length?S.allIds:collIds('test');if(!ids.length){await makeTests();return this.play(collIds('test'),0,'test');}return this.play(ids,-1,'all',{shuffle:true});}
    if(AE.el.paused)await this.resume();else this.pause();},
  async next(auto=false){if(S.ctrl&&!auto)return remoteCmd({op:'next'});const i=this.nextIdx(auto);
    if(i==null){if(auto&&prefs.radio){const more=similarTo(this.current,25,new Set(this.q));if(more.length){this.q.push(...more);if(this.orig)this.orig.push(...more);return this.load(this.qi+1);}}
      this.pause();try{AE.el.currentTime=0;}catch{}endListen();renderPlayer();return;}
    return this.load(i);},
  async prev(){if(S.ctrl)return remoteCmd({op:'prev'});if(AE.el.currentTime>4||this.qi<=0){try{AE.el.currentTime=0;}catch{}return;}return this.load(this.qi-1);},
  seek(s){if(S.ctrl)return remoteCmd({op:'seek',pos:s});const d=AE.el;if(isFinite(d.duration)){d.currentTime=Math.max(0,Math.min(d.duration-.5,s));L.last=null;updateTime();saveState();presenceSoon();}},
  toggleShuffle(){if(S.ctrl)return remoteCmd({op:'shuffle'});this.shuffle=!this.shuffle;const cur=this.q[this.qi];
    if(this.shuffle){this.orig=this.q.slice();this.q=[...this.q.slice(0,this.qi+1),...shuffleArr(this.q.slice(this.qi+1))];}
    else if(this.orig){this.q=this.orig.slice();this.qi=Math.max(0,this.q.indexOf(cur));}
    renderPlayer();renderQueueIfOpen();presenceSoon();},
  cycleRepeat(){if(S.ctrl)return remoteCmd({op:'repeat'});this.repeat=this.repeat==='off'?'all':this.repeat==='all'?'one':'off';renderPlayer();presenceSoon();},
  enqueue(ids,next){ids=ids.filter(id=>getTrack(id));if(!ids.length)return;
    if(S.ctrl)return remoteCmd({op:next?'next-up':'add',ids:ids.slice(0,150)});
    if(!this.current)return this.play(ids,0,'cola');
    if(next)this.q.splice(this.qi+1,0,...ids);else this.q.push(...ids);
    if(this.orig){const ci=this.orig.indexOf(this.q[this.qi]);if(next)this.orig.splice(ci+1,0,...ids);else this.orig.push(...ids);}
    toast(next?'Sonará a continuación':'Añadida a la cola');renderQueueIfOpen();saveState();},
  removeAt(i){if(i===this.qi||i<0||i>=this.q.length)return;const id=this.q[i];this.q.splice(i,1);if(i<this.qi)this.qi--;
    if(this.orig){const j=this.orig.indexOf(id);if(j>=0)this.orig.splice(j,1);}renderQueueIfOpen();}};

function similarTo(t,n,ex){if(!t||t.test||!S.tracks.size)return[];const dec=t.y?Math.floor(parseInt(t.y,10)/10):null;
  const score=x=>(x.arId===t.arId?2.5:0)+(t.g&&x.g&&norm(x.g)===norm(t.g)?2:0)+(dec!=null&&x.y&&Math.floor(parseInt(x.y,10)/10)===dec?1:0)+(S.likes[x.id]?1:0)+Math.random()*2.4;
  const out=[],per={};for(const [,x] of [...S.tracks.values()].filter(x=>!ex.has(x.id)).map(x=>[score(x),x]).sort((a,b)=>b[0]-a[0])){
    if((per[x.arId]=(per[x.arId]||0)+1)>3)continue;out.push(x.id);if(out.length>=n)break;}
  return out;}

/* eventos de las platinas */
AE.decks.forEach((d,i)=>{
  d.addEventListener('timeupdate',()=>{if(i!==AE.cur)return;tickListen();maybeXf();updateTime();});
  d.addEventListener('ended',()=>{if(i!==AE.cur||AE.xf)return;P.next(true);});
  d.addEventListener('playing',()=>{if(i===AE.cur){AE.errs=0;renderPlayer();wake();updateMSPos();BL.prefetch(document.body.classList.contains('carmode')?6:2);}});
  d.addEventListener('pause',()=>{if(i===AE.cur&&!AE.xf){renderPlayer();saveStateNow();presenceSoon();}});
  d.addEventListener('loadedmetadata',()=>{if(i===AE.cur){renderDials();updateMSPos();}});
  d.addEventListener('seeking',()=>{if(i===AE.cur)L.last=null;});
  d.addEventListener('error',()=>{if(i!==AE.cur||!d.getAttribute('src'))return;const t=P.current;if(!t)return;
    AE.errs++;toast('No se pudo reproducir «'+(t.t||'')+'»');
    if(AE.errs<4)setTimeout(()=>{if(P.current===t)P.next(true);},1200);else{AE.errs=0;renderPlayer();}});});

function maybeXf(){if(AE.xf||!AE.n||!prefs.fx||prefs.xf<=0||P.repeat==='one')return;const d=AE.el,dur=d.duration;
  if(!isFinite(dur)||dur<prefs.xf*2+6||dur-d.currentTime>prefs.xf)return;const ni=P.nextIdx(false);if(ni==null)return;startXf(ni);}
async function startXf(ni){AE.xf=true;const t=getTrack(P.q[ni]);if(!t){AE.xf=false;return;}const o=1-AE.cur;
  const url=await srcFor(t);setDeckSrc(o,url);const od=AE.decks[o];AE.setLevel(o,0);
  try{await od.play();}catch{AE.xf=false;return;}
  const secs=prefs.xf,old=AE.cur;AE.setLevel(o,1,secs);AE.setLevel(old,0,secs);endListen();AE.cur=o;P.qi=ni;startListen(t);onTrackChange();
  AE.xfTimer=setTimeout(()=>{AE.decks[old].pause();AE.xf=false;},secs*1000+120);}
function cancelXf(){clearTimeout(AE.xfTimer);AE.decks[1-AE.cur].pause();AE.setLevel(AE.cur,1);AE.setLevel(1-AE.cur,0);AE.xf=false;}

/* minutos escuchados de verdad */
const L={t:null,secs:0,last:null};
function startListen(t){L.t=t;L.secs=0;L.last=null;}
function tickListen(){const ct=AE.el.currentTime;if(L.last!=null&&!AE.el.paused){const dd=ct-L.last;if(dd>0&&dd<1.6)L.secs+=dd;}L.last=ct;}
function endListen(){if(L.t&&L.secs>=5)recordListen(L.t,L.secs);L.t=null;L.secs=0;L.last=null;}
addEventListener('pagehide',()=>{endListen();saveStateNow();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveStateNow();else{wake();renderDials();}});

/* controles del sistema (pantalla bloqueada, auriculares, volante si la unidad los pasa) */
function updateMS(){if(!('mediaSession' in navigator))return;const t=P.current;
  try{navigator.mediaSession.metadata=t?new MediaMetadata({title:t.t||'Sin título',artist:t.a||'',album:t.al||'',
    artwork:t.c&&COV.mem.has(t.c)?[{src:COV.mem.get(t.c),sizes:'256x256',type:'image/jpeg'}]:[]}):null;}catch{}}
function updateMSPos(){try{const d=AE.el;if('mediaSession' in navigator&&isFinite(d.duration)&&d.duration>0)navigator.mediaSession.setPositionState({duration:d.duration,position:Math.min(d.currentTime,d.duration),playbackRate:1});}catch{}}
(()=>{const ms=navigator.mediaSession;if(!ms)return;const set=(a,f)=>{try{ms.setActionHandler(a,f);}catch{}};
  set('play',()=>P.resume());set('pause',()=>P.pause());set('nexttrack',()=>P.next());set('previoustrack',()=>P.prev());set('seekto',e=>P.seek(e.seekTime));})();

let wl=null;
async function wake(){if(!document.body.classList.contains('carmode')||AE.el.paused||wl)return;
  try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}catch{}}

/* ===================== prueba de sonido (generada aquí, no ocupa la nube) ===================== */
function wavBlob(buf){const ch=buf.numberOfChannels,sr=buf.sampleRate,n=buf.length,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  const cs=[...Array(ch)].map((_,i)=>buf.getChannelData(i));let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const s=Math.max(-1,Math.min(1,cs[c][i]));v.setInt16(o,s<0?s*0x8000:s*0x7fff,true);o+=2;}
  return new Blob([ab],{type:'audio/wav'});}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(ctx,f,t0,len,{pan=0,g=.25,type='sine',a=.01}={}){const o=ctx.createOscillator(),e=ctx.createGain(),p=ctx.createStereoPanner();
  o.type=type;o.frequency.value=f;p.pan.value=pan;e.gain.setValueAtTime(0,t0);e.gain.linearRampToValueAtTime(g,t0+a);e.gain.exponentialRampToValueAtTime(.0005,t0+len);
  o.connect(e);e.connect(p);p.connect(ctx.destination);o.start(t0);o.stop(t0+len+.05);}
async function makeTests(){if(TEST.size)return;const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!OAC)return;const sr=22050;
  const defs=[
    {id:'test-lr',t:'Izquierda y derecha',du:12,fn:c=>{[[-1,.5],[1,4.5],[0,8.5]].forEach(([pan,s])=>[72,76,79,84].forEach((m,k)=>tone(c,mf(m),s+k*.22,1.6,{pan,g:.22})));}},
    {id:'test-bass',t:'Barrido de graves',du:20,fn:c=>{const o=c.createOscillator(),e=c.createGain();o.frequency.setValueAtTime(30,0);o.frequency.exponentialRampToValueAtTime(220,19);
      e.gain.setValueAtTime(0,0);e.gain.linearRampToValueAtTime(.32,1);e.gain.setValueAtTime(.32,18.5);e.gain.linearRampToValueAtTime(0,19.8);o.connect(e);e.connect(c.destination);o.start(0);o.stop(20);}},
    {id:'test-mel',t:'Melodía del salpicadero',du:40,fn:c=>{const ch=[[57,61,64],[54,57,61],[50,54,57],[52,56,59]],bar=2.5,e8=bar/8;
      for(let b=0;b<16;b++){const C=ch[b%4],t0=b*bar;C.forEach(m=>tone(c,mf(m),t0,bar*.98,{g:.05,a:.3}));
        for(let k=0;k<4;k++)tone(c,mf(C[0]-12),t0+k*bar/4,bar/4*.9,{g:.16,type:'triangle'});
        for(let k=0;k<8;k++){const m=C[[0,1,2,1,0,2,1,2][k]]+12+(b>=8&&k%4===3?12:0);tone(c,mf(m),t0+k*e8,e8*1.8,{g:.07,type:'triangle',pan:k%2?-.35:.35});}}}}];
  for(const d of defs){try{const c=new OAC(2,sr*d.du,sr);d.fn(c);const buf=await c.startRendering();const url=URL.createObjectURL(wavBlob(buf));TESTURLS.add(url);
    TEST.set(d.id,{id:d.id,t:d.t,a:'Prueba de sonido',al:'Prueba de sonido',du:d.du,test:true,url});}catch(e){console.warn(e);}}}

<script>
"use strict";
/* ===================== interfaz: navegación, filas, hojas ===================== */
const VIEWS=['inicio','buscar','biblioteca','dj','resumen','ajustes','importar'];
const NAV=[['inicio','Inicio','home'],['buscar','Buscar','search'],['biblioteca','Biblioteca','lib'],['dj','Claude DJ','dj'],['resumen','Tu resumen','stats'],['importar','Tu Drive','up'],['ajustes','Ajustes','gear']];
const LISTS=new Map();let listTok=0;
const regList=ids=>{const k='l'+(++listTok);LISTS.set(k,ids);if(LISTS.size>60)LISTS.delete(LISTS.keys().next().value);return k;};
const keepScroll={};

function go(v){if(!VIEWS.includes(v))v='inicio';closeNp();closeLayer();if(document.body.classList.contains('carmode'))carOff();
  S.view=v;S.stack=[];try{if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);}catch{}renderNav();renderView(true);$('#main').scrollTop=0;}
function openDetail(d){S.stack.push(d);closeLayer();if(document.body.classList.contains('carmode'))carOff();closeNp();renderView(true);$('#main').scrollTop=0;}
function back(){S.stack.pop();renderView(true);}
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v==='coche'){carOn();return;}if(VIEWS.includes(v)&&v!==S.view){S.view=v;S.stack=[];renderNav();renderView(true);}});

function renderNav(){const nav=$('#nav');nav.textContent='';
  for(const [v,nm,icn] of NAV)nav.append(h('button',{class:S.view===v&&!S.stack.length?'on':'','data-act':'go','data-v':v},ic(icn),nm));
  const tabs=$('#tabs');tabs.textContent='';
  for(const [v,nm,icn] of NAV.slice(0,5))tabs.append(h('button',{class:S.view===v?'on':'','data-act':'go','data-v':v},ic(icn),nm==='Tu resumen'?'Resumen':nm==='Claude DJ'?'DJ':nm));}
function renderSideLists(){const box=$('#sideLists');box.textContent='';
  box.append(h('button',{'data-act':'detail','data-t':'likes'},'Me gusta'));
  for(const [id,p] of sortedLists())box.append(h('button',{'data-act':'detail','data-t':'pl','data-id':id},(p.ps?p.ps+' · ':'')+(p.nm||'Lista')));}
const sortedLists=()=>Object.entries(S.playlists).sort((a,b)=>(a[1].ps||9)-(b[1].ps||9)||coll.compare(a[1].nm||'',b[1].nm||''));
function presetMap(){const m={};for(const [id,p] of Object.entries(S.playlists))if(p.ps&&!m[p.ps])m[p.ps]=id;return m;}

let renderTimer=0;
function renderSoon(){clearTimeout(renderTimer);renderTimer=setTimeout(renderAll,140);}
function renderAll(){renderNav();renderSideLists();renderView(false);renderPlayer();renderDials();renderPresets();if(document.body.classList.contains('carmode'))renderCar();}

function renderView(force){const view=$('#view'),main=$('#main');
  const ae=document.activeElement;if(!force&&ae&&view.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)){if(S.view==='buscar')renderSearchResults();return;}

  catch(e){console.error(e);view.append(h('div',{class:'note'},'Algo ha fallado al dibujar esta pantalla. Vuelve a Inicio.'));}
  if(!force)main.scrollTop=st;}

/* filas de canciones, con carga por tandas para bibliotecas grandes */
function trackRow(t,i,tok,o={}){const cur=P.current&&P.current.id===t.id;
  const cv=o.num?h('div',{class:'cv',style:'background:none;color:var(--muted);font:500 14px var(--f-ui)'},String(t.n||i+1)):fillCover(h('div',{class:'cv'}),t.c,t.al||t.t);
  return h('div',{class:'tr'+(cur?' cur':''),'data-act':'row','data-l':tok,'data-i':i,'data-tid':t.id,role:'button',tabindex:'0'},cv,
    h('div',{class:'meta'},h('div',{class:'tt'},t.t||'Sin título'),h('div',{class:'ta'},(t.a||'')+(o.noAlbum||!t.al?'':' · '+t.al))),
    S.dl.has(t.id)?h('span',{class:'dl',title:'Descargada en este aparato'},ic('dl','width:16px;height:16px')):h('span'),
    h('span',{class:'du'},fmt(t.du)),
    t.test?h('span'):h('button',{class:'ibtn','data-act':'trackMenu','data-tid':t.id,'data-ctx':o.ctx||'','aria-label':'Más opciones'},ic('more')));}
function trackList(ids,src,o={}){const tok=regList(ids);LISTS.get(tok).src=src;const box=h('div',{class:'tracks'});let n=0;const step=o.step||120;
  const more=h('button',{class:'pbtn ghost more'},'Mostrar más');
  const add=()=>{const end=Math.min(ids.length,n+step);for(;n<end;n++){const t=getTrack(ids[n]);if(t)box.append(trackRow(t,n,tok,o));}

  more.onclick=add;add();
  if(!ids.length)box.append(h('div',{class:'sub',style:'padding:10px 8px'},o.empty||'No hay canciones.'));
  if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)&&n<ids.length)add();},{root:$('#main'),rootMargin:'600px'});queueMicrotask(()=>more.isConnected&&io.observe(more));}
  return h('div',null,box,n<ids.length?more:null);}
function markCurrent(){const id=P.current&&P.current.id;$$('.tr').forEach(r=>r.classList.toggle('cur',r.dataset.tid===id));}

const albumCard=A=>card(A.cover,A.title,A.artist+(A.year?' · '+A.year:''),'detail',{'data-t':'al','data-id':A.id});
const artistCard=R=>card(R.cover,R.name,plural(R.albums.length,'álbum','álbumes'),'detail',{'data-t':'ar','data-id':R.id},true);
function listCard(id,p){const ids=collIds('pl:'+id);const first=getTrack(ids[0]);const c=coverEl(first&&first.c,p.nm||'Lista',p.ps?'EMISORA '+p.ps:'');

function likesCard(){const ids=likedIds();const c=coverEl('','Me gusta','TUS FAVORITAS');c.style.background='linear-gradient(135deg,#6b2a12,#1a1210)';
  return h('button',{class:'card','data-act':'detail','data-t':'likes'},c,h('div',{class:'t'},'Me gusta'),h('div',{class:'s'},plural(ids.length,'canción','canciones')));}
const secH=(title,...right)=>h('div',{class:'sec-h'},h('h2',null,title),h('span',{class:'sp'}),...right);

/* hojas (menús, diálogos) */
function closeLayer(){$('#layer').textContent='';}
function openSheet(...kids){const sheet=h('div',{class:'sheet',role:'dialog','aria-modal':'true'},...kids);
  const scrim=h('div',{class:'scrim',onclick:e=>{if(e.target===scrim)closeLayer();}},sheet);
  const L=$('#layer');L.textContent='';L.append(scrim);const f=sheet.querySelector('input,button');if(f)setTimeout(()=>f.focus(),30);return sheet;}
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#layer').firstChild)closeLayer();else if(!$('#np').hidden)closeNp();}});
const mBtn=(label,icon,fn,cls)=>h('button',{class:cls||'',onclick:()=>{closeLayer();fn();}},ic(icon),label);
function confirmSheet(title,text,okLabel,fn){openSheet(h('h3',null,title),h('p',{class:'sub',style:'margin:0'},text),
  h('div',{class:'row',style:'justify-content:flex-end'},h('button',{class:'pbtn ghost',onclick:closeLayer},'Cancelar'),h('button',{class:'pbtn amber',onclick:()=>{closeLayer();fn();}},okLabel)));}
function promptSheet(title,label,val,okLabel,fn){const inp=h('input',{type:'text',id:'promptIn',value:val||'',maxlength:'80',autocomplete:'off'});
  const ok=()=>{const v=inp.value.trim();if(!v)return;closeLayer();fn(v);};inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok();});
  openSheet(h('h3',null,title),h('label',{class:'field'},h('span',{class:'label'},label),inp),
    h('div',{class:'row',style:'justify-content:flex-end'},h('button',{class:'pbtn ghost',onclick:closeLayer},'Cancelar'),h('button',{class:'pbtn amber',onclick:ok},okLabel)));}

function trackMenu(id,ctx){const t=getTrack(id);if(!t)return;const liked=!!S.likes[id];
  const head=h('div',{class:'row',style:'flex-wrap:nowrap'},fillCover(h('div',{class:'cv',style:'width:52px;height:52px;border-radius:4px;overflow:hidden;flex:none;display:grid;place-items:center'}),t.c,t.al||t.t),
    h('div',{style:'min-width:0'},h('div',{style:'font-weight:600'},t.t),h('div',{class:'sub'},(t.a||'')+(t.al?' · '+t.al:''))));
  const items=[mBtn(liked?'Quitar de Me gusta':'Me gusta',liked?'heartf':'heart',()=>toggleLike(id)),
    mBtn('Sonará a continuación','queue',()=>P.enqueue([id],true)),mBtn('Añadir a la cola','plus',()=>P.enqueue([id],false)),
    mBtn('Añadir a una lista…','list',()=>addToListSheet([id])),
    mBtn('Ir al álbum','dj',()=>openDetail({t:'al',id:t.alId})),mBtn('Ir al artista','lib',()=>openDetail({t:'ar',id:t.arId})),
    S.pins.includes('tr:'+id)?mBtn('Quitar descarga de este aparato','close',()=>DL.pin('tr:'+id,false)):S.dl.has(id)?null:mBtn('Descargar en este aparato','dl',()=>DL.pin('tr:'+id,true))];
  if(ctx&&ctx.startsWith('pl:')){const pid=ctx.slice(3),p=S.playlists[pid];if(p)items.push(mBtn('Quitar de esta lista','close',()=>plWrite(pid,{ids:(p.ids||[]).filter(x=>x!==id),up:Date.now()})));}
  openSheet(head,h('div',{class:'menu'},...items.filter(Boolean)));}
function addToListSheet(ids){const lists=sortedLists();
  const create=()=>promptSheet('Nueva lista','Nombre','','Crear',async nm=>{const id=rid(8);await plWrite(id,{nm,ids,cr:Date.now(),up:Date.now(),ps:null});toast('Creada «'+nm+'»');});
  openSheet(h('h3',null,'Añadir a una lista'),h('div',{class:'menu'},mBtn('Nueva lista…','plus',create),
    ...lists.map(([pid,p])=>mBtn(p.nm||'Lista','list',async()=>{const cur=p.ids||[];const add=ids.filter(x=>!cur.includes(x));
      if(!add.length){toast('Ya estaba en «'+p.nm+'»');return;}await plWrite(pid,{ids:[...cur,...add],up:Date.now()});toast('Añadida a «'+p.nm+'»');}))));}
function listMenu(id){const p=S.playlists[id];if(!p)return;
  openSheet(h('h3',null,p.nm||'Lista'),h('div',{class:'menu'},
    mBtn('Cambiar nombre','list',()=>promptSheet('Cambiar nombre','Nombre',p.nm,'Guardar',nm=>plWrite(id,{nm,up:Date.now()}))),
    mBtn('Borrar lista','trash',()=>confirmSheet('Borrar «'+(p.nm||'Lista')+'»','Las canciones siguen en tu biblioteca.','Borrar',async()=>{S.stack=[];await plWrite(id,null);renderView(true);}),'bad')));}
async function setPreset(id,n){const p=S.playlists[id];if(!p)return;const map=presetMap();
  if(p.ps===n){await plWrite(id,{ps:null});return;}
  if(map[n]&&map[n]!==id)await plWrite(map[n],{ps:null});await plWrite(id,{ps:n});toast('Emisora '+n+': «'+p.nm+'»');}

/* acciones por delegación */
const ACT={
  go:el=>go(el.dataset.v),
  detail:el=>openDetail({t:el.dataset.t,id:el.dataset.id||''}),
  back:()=>back(),
  row:el=>{const ids=LISTS.get(el.dataset.l);if(!ids)return;P.play(ids,+el.dataset.i,ids.src||'');},
  trackMenu:el=>trackMenu(el.dataset.tid,el.dataset.ctx),
  playColl:el=>{const k=el.dataset.k;P.play(collIds(k),0,k,{shuffle:false});},
  shufColl:el=>{const k=el.dataset.k;P.play(collIds(k),-1,k,{shuffle:true});},
  pin:el=>{const k=el.dataset.k;DL.pin(k,!S.pins.includes(k));},
  listMenu:el=>listMenu(el.dataset.id),
  preset:el=>{const id=presetMap()[el.dataset.n];if(id)P.play(collIds('pl:'+id),P.shuffle?-1:0,'pl:'+id);else toast('Botón '+el.dataset.n+' libre: asígnalo desde una lista');},
  setPreset:el=>setPreset(el.dataset.id,+el.dataset.n),
  newList:()=>promptSheet('Nueva lista','Nombre','','Crear',async nm=>{const id=rid(8);await plWrite(id,{nm,ids:[],cr:Date.now(),up:Date.now(),ps:null});openDetail({t:'pl',id});}),
  toggle:()=>P.toggle(),next:()=>P.next(),prev:()=>P.prev(),shuffle:()=>P.toggleShuffle(),repeat:()=>P.cycleRepeat(),
  like:()=>{const t=P.current;if(t&&!t.test)toggleLike(t.id);},
  openNp:()=>openNp(),closeNp:()=>closeNp(),openQueue:()=>openQueue(),openEq:()=>openEq(),openDevices:()=>openDevices(),
  carOn:()=>carOn(),carOff:()=>carOff(),
  soundTest:async()=>{await makeTests();P.play(collIds('test'),0,'test',{shuffle:false});},
  resumeState:()=>resumeFromState(),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.tr[data-act]')){ACT.row(e.target);return;}
  if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))||e.target.isContentEditable)return;
  if(e.code==='Space'&&!e.target.closest('button,[role=slider]')){e.preventDefault();P.toggle();}
  else if(e.key==='n'||e.key==='N')P.next();else if(e.key==='p'||e.key==='P')P.prev();});
</script>
<script>
"use strict";
/* ===================== pantallas: inicio, buscar, biblioteca, detalle ===================== */
const sumDur=ids=>ids.reduce((s,id)=>s+((getTrack(id)||{}).du||0),0);
function onboarding(){return h('div',{class:'sec'},
  h('div',{class:'lcd',style:'padding:18px 20px'},h('div',{style:'font-size:22px'},'GUANTERA VACÍA'),h('div',{class:'dim',style:'font-size:14px;margin-top:4px'},'Tu música sale de la carpeta «'+S.cfg.folder+'» de tu Drive.')),
  h('div',{class:'steps'},
    h('div',{class:'step'},h('span',{class:'n'},'PASO 1'),h('b',null,'Busca tus canciones'),h('span',{class:'sub'},'En Tu Drive, pulsa Buscar canciones. Mejor la primera vez en el ordenador o con wifi: lee artista, álbum y portada de cada una.')),
    h('div',{class:'step'},h('span',{class:'n'},'PASO 2'),h('b',null,'Haz listas y asígnalas a las emisoras'),h('span',{class:'sub'},'Los botones 1 a 6 del frontal funcionan como las emisoras de una radio.')),
    h('div',{class:'step'},h('span',{class:'n'},'PASO 3'),h('b',null,'Descarga lo que quieras en cada aparato'),h('span',{class:'sub'},'En el coche, lo descargado suena sin gastar datos y aguanta los túneles.'))),
  h('div',{class:'row'},LS.get('authed',false)?h('button',{class:'pbtn amber','data-act':'go','data-v':'importar'},ic('up'),'Buscar canciones'):h('button',{class:'pbtn amber','data-act':'login'},'Entrar con Google'),
    h('button',{class:'pbtn','data-act':'soundTest'},ic('wave'),'Prueba de sonido')));}

function viewHome(v){const hr=new Date().getHours();const greet=hr<6?'Buenas noches':hr<13?'Buenos días':hr<21?'Buenas tardes':'Buenas noches';
  v.append(h('div',{class:'row'},h('h1',null,greet),h('span',{class:'sp'}),
    device?h('button',{class:'chip','data-act':'go','data-v':'ajustes'},ic(KIND[device.kind].icon,'width:16px;height:16px'),device.name):null,
    h('button',{class:'ibtn','data-act':'carOn','aria-label':'Modo coche'},ic('car'))));
  if(!LS.get('authed',false)){v.append(loginCard());return;}
  if(!S.libReady){v.append(h('div',{class:'lcd',style:'padding:16px 18px;font-size:18px'},'SINTONIZANDO TU BIBLIOTECA…'));return;}
  if(!AUTH.ok())v.append(h('div',{class:'note row'},h('span',{style:'flex:1;min-width:0'},navigator.onLine?'Desconectado de Google. Lo descargado suena igual.':'Sin conexión. Suena lo descargado en este aparato.'),
    navigator.onLine?h('button',{class:'pbtn amber','data-act':'login'},'Reconectar'):null));
  if(SYNC.running)v.append(h('div',{class:'lcd',style:'padding:10px 14px;font-size:15px'},SYNC.phase.toUpperCase()));
  const rs=S.remoteState;
  if(rs&&rs.tid&&S.tracks.has(rs.tid)&&!P.current&&Date.now()-(rs.at||0)<4*864e5){const t=S.tracks.get(rs.tid);const other=device&&rs.dev!==device.id;
    v.append(h('div',{class:'lcd',style:'padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap'},
      h('div',{style:'min-width:0;flex:1'},h('div',{class:'dim',style:'font-size:12px'},other?'SEGUÍAS EN EL '+(rs.dn||'OTRO APARATO').toUpperCase():'LO DEJASTE AQUÍ'),
        h('div',{style:'font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'},t.t||'Sin título'),
        h('div',{style:'font-size:14px;opacity:.8'},(t.a||'')+' · '+fmt(rs.pos||0))),
      h('button',{class:'pbtn amber','data-act':'resumeState'},ic('play'),'Continuar aquí')));}
  if(!S.tracks.size){v.append(onboarding());return;}
  v.append(h('div',{class:'sec'},secH('Pídele algo al DJ',h('button',{class:'chip','data-act':'go','data-v':'dj'},'Abrir el DJ')),
    h('div',{class:'row'},...DJ_PRESETS.slice(0,5).map(p=>h('button',{class:'chip','data-act':'djPreset','data-p':p.k},p.nm)))));
  const pm=presetMap();
  v.append(h('div',{class:'sec'},secH('Tus emisoras',h('span',{class:'sub'},'Botones 1 a 6 del frontal')),h('div',{class:'grid'},...[1,2,3,4,5,6].map(n=>{const id=pm[n];
    if(id&&S.playlists[id])return listCard(id,S.playlists[id]);
    const c=coverEl('','Emisora '+n,'LIBRE');c.style.background='repeating-linear-gradient(135deg,#1b1d21 0 8px,#202328 8px 16px)';
    return h('button',{class:'card','data-act':'libTab','data-k':'listas'},c,h('div',{class:'t'},'Emisora '+n),h('div',{class:'s'},'Asígnale una lista'));}))));
  v.append(h('div',{class:'sec'},secH('Añadido hace poco',h('button',{class:'chip','data-act':'libTab','data-k':'canciones'},'Ver todo')),trackList(S.recentIds.slice(0,8),'recent',{step:8})));
  v.append(h('div',{class:'sec'},secH('Para arrancar'),h('div',{class:'row'},
    h('button',{class:'pbtn amber','data-act':'shufColl','data-k':'all'},ic('shuffle'),'Toda la biblioteca'),
    likedIds().length?h('button',{class:'pbtn','data-act':'shufColl','data-k':'likes'},ic('heartf'),'Me gusta'):null,
    S.dl.size?h('button',{class:'pbtn','data-act':'shufColl','data-k':'dl'},ic('dl'),'Lo descargado'):null)));
  v.append(h('div',{class:'sec'},secH('Tus listas',h('button',{class:'chip','data-act':'newList'},ic('plus','width:16px;height:16px'),'Nueva')),
    h('div',{class:'grid'},likesCard(),...sortedLists().slice(0,11).map(([id,p])=>listCard(id,p)))));}

async function resumeFromState(){const rs=S.remoteState;if(!rs)return;const q=(rs.q||[]).filter(id=>S.tracks.has(id));let qi=q.indexOf(rs.tid);
  if(qi<0){q.unshift(rs.tid);qi=0;}if(S.ctrl)stopControl();P.shuffle=false;P.orig=q.slice();P.q=q;P.src=rs.src||'';await P.load(qi,{pos:rs.pos||0});
}

/* buscar */
function viewSearch(v){const inp=h('input',{type:'search',id:'q',placeholder:'Canción, artista o álbum',value:S.q,autocomplete:'off',enterkeyhint:'search','aria-label':'Buscar'});
  inp.addEventListener('input',debounce(()=>{S.q=inp.value;renderSearchResults();},160));
  v.append(h('h1',null,'Buscar'),h('div',{class:'search'},inp),h('div',{id:'results',class:'sec',style:'gap:26px'}));renderSearchResults();
  if(!matchMedia('(pointer:coarse)').matches)setTimeout(()=>inp.focus(),30);}
function renderSearchResults(){const box=$('#results');if(!box)return;box.textContent='';const q=norm(S.q);
  if(!S.tracks.size){box.append(h('div',{class:'sub'},'Cuando importes música, aquí la encontrarás.'));return;}
  if(!q){box.append(h('div',{class:'sec'},secH('Artistas'),h('div',{class:'grid'},...S.artists.slice(0,24).map(artistCard))));return;}
  const words=q.split(' '),match=s=>words.every(w=>s.includes(w));const ts=[];
  for(const t of S.tracks.values())if(match(norm([t.t,t.a,t.al,t.aa].join(' '))))ts.push(t);
  ts.sort((a,b)=>(match(norm(a.t))?0:1)-(match(norm(b.t))?0:1)||coll.compare(a.t||'',b.t||''));
  const als=S.albums.filter(A=>match(norm(A.title+' '+A.artist))).slice(0,12),ars=S.artists.filter(R=>match(norm(R.name))).slice(0,12);
  if(!ts.length&&!als.length&&!ars.length){box.append(h('div',{class:'sub'},'Nada con «'+S.q+'».'));return;}
  if(ars.length)box.append(h('div',{class:'sec'},secH('Artistas'),h('div',{class:'grid'},...ars.map(artistCard))));
  if(als.length)box.append(h('div',{class:'sec'},secH('Álbumes'),h('div',{class:'grid'},...als.map(albumCard))));
  if(ts.length)box.append(h('div',{class:'sec'},secH('Canciones',h('span',{class:'sub'},plural(ts.length,'resultado','resultados'))),trackList(ts.slice(0,300).map(t=>t.id),'search',{step:60})));}

/* biblioteca */
const LIBTABS=[['listas','Listas'],['albumes','Álbumes'],['artistas','Artistas'],['canciones','Canciones'],['descargas','Descargas']];
ACT.libTab=el=>{S.libTab=el.dataset.k;if(S.view!=='biblioteca'){S.view='biblioteca';S.stack=[];try{history.replaceState(null,'','#biblioteca');}catch{}renderNav();}else S.stack=[];renderView(true);};
function viewLibrary(v){const tab=S.libTab||'listas';
  v.append(h('h1',null,'Biblioteca'),h('div',{class:'row'},...LIBTABS.map(([k,nm])=>h('button',{class:'chip'+(tab===k?' on':''),'data-act':'libTab','data-k':k},nm))));
  if(tab==='descargas')return viewDownloads(v);
  if(!S.tracks.size&&tab!=='listas'){v.append(onboarding());return;}
  if(tab==='listas')v.append(h('div',null,h('button',{class:'pbtn','data-act':'newList'},ic('plus'),'Nueva lista')),h('div',{class:'grid'},likesCard(),...sortedLists().map(([id,p])=>listCard(id,p))));
  else if(tab==='albumes')v.append(h('div',{class:'grid'},...S.albums.map(albumCard)));
  else if(tab==='artistas')v.append(h('div',{class:'grid'},...S.artists.map(artistCard)));
  else v.append(h('div',{class:'row'},h('button',{class:'pbtn amber','data-act':'playColl','data-k':'all'},ic('play'),'Reproducir'),
      h('button',{class:'pbtn','data-act':'shufColl','data-k':'all'},ic('shuffle'),'Aleatorio'),h('span',{class:'sub'},plural(S.allIds.length,'canción','canciones')+' · '+mins(sumDur(S.allIds)))),
    trackList(S.allIds,'all'));}
function viewDownloads(v){const info=h('div',{class:'note'},'Calculando espacio…');v.append(info);
  if(!S.dlOk){info.textContent='Este navegador no deja guardar canciones aquí. Se escucharán por conexión.';return;}
  (async()=>{let used=0;for(const id of S.dl){const t=S.tracks.get(id);if(t)used+=t.sz||0;}let free='';
    try{const e=await navigator.storage.estimate();if(e&&e.quota)free=' · quedan unos '+(Math.max(0,e.quota-e.usage)/1e9).toFixed(1).replace('.',',')+' GB libres para la app';}catch{}
    info.textContent='';info.append(h('b',null,plural(S.dl.size,'canción descargada','canciones descargadas')+' en este aparato'),' · ocupan '+(used/1e9).toFixed(2).replace('.',',')+' GB'+free+'.');})();
  const allOn=S.pins.includes('all');
  v.append(h('div',{class:'row'},h('button',{class:'pbtn'+(allOn?' on':''),'data-act':'pin','data-k':'all'},ic(allOn?'check':'dl'),allOn?'Toda la biblioteca se mantiene descargada':'Descargar toda la biblioteca'),
    DL.busy?h('span',{class:'sub',id:'dlStatus'},'Descargando… quedan '+DL.left):h('span',{class:'sub',id:'dlStatus'}),
    S.dl.size?h('button',{class:'pbtn ghost','data-act':'dlClear'},ic('trash'),'Borrar descargas'):null));
  const pins=S.pins.filter(k=>k!=='all');
  if(pins.length)v.append(h('div',{class:'sec'},secH('Se mantienen descargadas'),h('div',{class:'menu'},...pins.map(k=>h('div',{class:'row',style:'min-height:44px'},
    h('span',{style:'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},k.startsWith('tr:')?((getTrack(k.slice(3))||{}).t||'Canción'):collName(k)),
    h('button',{class:'pbtn ghost','data-act':'pin','data-k':k},'Quitar'))))));
  v.append(h('div',{class:'sec'},secH('Canciones descargadas'),trackList(collIds('dl'),'dl',{empty:'Todavía no hay nada descargado en este aparato.'})));}
ACT.dlClear=()=>confirmSheet('Borrar descargas','Las canciones siguen en tu nube; solo se quitan de este aparato.','Borrar',()=>DL.clearAll());
function renderDlStatus(){const el=$('#dlStatus');if(el)el.textContent=DL.busy?'Descargando… quedan '+DL.left:'';}

/* detalle de álbum, artista, lista y colecciones */
function viewDetail(v,d){v.append(h('div',null,h('button',{class:'pbtn ghost','data-act':'back'},ic('back'),'Atrás')));
  let key,title,sub,cover='',kind,ids;
  if(d.t==='al'){const A=S.albumById.get(d.id);if(!A)return gone(v);key='al:'+A.id;title=A.title;kind='Álbum';cover=A.cover;ids=A.ids;
    sub=[A.artist,A.year,plural(ids.length,'canción','canciones'),mins(sumDur(ids))].filter(Boolean).join(' · ');}
  else if(d.t==='ar'){const R=S.artistById.get(d.id);if(!R)return gone(v);key='ar:'+R.id;title=R.name;kind='Artista';cover=R.cover;ids=R.ids;
    sub=plural(R.albums.length,'álbum','álbumes')+' · '+plural(ids.length,'canción','canciones');}
  else if(d.t==='pl'){const p=S.playlists[d.id];if(!p)return gone(v);key='pl:'+d.id;title=p.nm||'Lista';kind='Lista'+(p.ps?' · emisora '+p.ps:'');ids=collIds(key);
    cover=(getTrack(ids[0])||{}).c||'';sub=plural(ids.length,'canción','canciones')+' · '+mins(sumDur(ids));}
  else{key=d.t;ids=collIds(key);title=collName(key);kind=d.t==='test'?'Generada en este aparato':'Colección';
    sub=plural(ids.length,'canción','canciones')+(ids.length?' · '+mins(sumDur(ids)):'');}
  const pinned=S.pins.includes(key),dlc=ids.filter(id=>S.dl.has(id)).length,full=ids.length>0&&dlc===ids.length;
  const actions=h('div',{class:'row'},
    h('button',{class:'pbtn amber','data-act':'playColl','data-k':key,disabled:!ids.length},ic('play'),'Reproducir'),
    h('button',{class:'pbtn','data-act':'shufColl','data-k':key,disabled:!ids.length},ic('shuffle'),'Aleatorio'),
    d.t!=='test'&&S.dlOk?h('button',{class:'pbtn'+(pinned||full?' on':''),'data-act':'pin','data-k':key,disabled:!ids.length&&!pinned},ic(pinned||full?'check':'dl'),
      pinned&&!full?'Descargando '+dlc+'/'+ids.length:full?'Descargada':'Descargar'):null,
    d.t==='pl'?h('button',{class:'ibtn','data-act':'listMenu','data-id':d.id,'aria-label':'Opciones de la lista'},ic('more')):null);
  const info=h('div',{class:'info'},h('span',{class:'label'},kind),h('h1',null,title),h('span',{class:'sub'},sub),actions);
  if(d.t==='pl')info.append(h('div',{class:'row'},h('span',{class:'label'},'Emisora'),h('div',{class:'presets-pick'},
    ...[1,2,3,4,5,6].map(n=>h('button',{class:'pbtn'+(S.playlists[d.id].ps===n?' on':''),'data-act':'setPreset','data-id':d.id,'data-n':n,'aria-label':'Emisora '+n},String(n))))));
  const cv=coverEl(cover,title,kind.toUpperCase());if(d.t==='ar')cv.style.borderRadius='50%';
  v.append(h('div',{class:'hero'},cv,info));
  if(d.t==='ar'){const R=S.artistById.get(d.id);v.append(h('div',{class:'sec'},secH('Álbumes'),h('div',{class:'grid'},...R.albums.map(id=>albumCard(S.albumById.get(id))))),
    h('div',{class:'sec'},secH('Todas sus canciones'),trackList(ids,key)));return;}
  v.append(trackList(ids,key,{num:d.t==='al',noAlbum:d.t==='al',ctx:d.t==='pl'?key:'',
    empty:d.t==='pl'?'Lista vacía. Añade canciones desde el menú ⋯ de cada una.':d.t==='likes'?'Toca ⋯ en una canción y elige Me gusta.':'No hay canciones.'}));}
function gone(v){v.append(h('div',{class:'note'},'Esto ya no está en tu biblioteca.'));}
</script>
<script>
"use strict";
/* ===================== frontal, "ahora suena", modo coche ===================== */
const savePrefsSoon=debounce(savePrefs,400);
function nowInfo(){
  if(S.ctrl){const p=S.peers.find(x=>x.peer===S.ctrl);const pr=(p&&p.presence)||{};const t=getTrack(pr.tid);const dur=pr.dur||(t&&t.du)||0;

let lastMs=0;

    if(nd)nd.style.left=x;if(fl)fl.style.width=x;d.setAttribute('aria-valuenow',Math.round(pos));d.setAttribute('aria-valuetext',fmt(pos)+' de '+fmt(dur));});

function renderDials(){const dur=nowInfo().dur||0;
  $$('[data-dial]').forEach(d=>{if(!d.firstChild){d.append(h('div',{class:'fill'}),h('div',{class:'ticks'}),h('div',{class:'nums'}),h('span',{class:'lab'},'MIN'),h('div',{class:'needle'}));
      d.tabIndex=0;d.setAttribute('role','slider');d.setAttribute('aria-label','Posición en la canción');d.setAttribute('aria-valuemin','0');bindDial(d);}
    const key=String(Math.round(dur));if(d.dataset.dur===key)return;d.dataset.dur=key;const nums=d.querySelector('.nums');nums.textContent='';
    if(dur>0){const m=dur/60,step=m<=8?1:m<=16?2:m<=40?5:10;for(let x=0;x<=m+1e-6;x+=step)nums.append(h('span',{style:'left:'+(x*60/dur*100)+'%'},String(x)));}

function bindDial(d){const frac=e=>{const r=d.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left-8)/(r.width-16)));};let drag=false;
  const show=f=>{const x='calc(8px + (100% - 16px) * '+f+')';d.querySelector('.needle').style.left=x;d.querySelector('.fill').style.width=x;};
  d.addEventListener('pointerdown',e=>{if(!nowInfo().dur)return;drag=true;d.dataset.drag='1';try{d.setPointerCapture(e.pointerId);}catch{}show(frac(e));});
  d.addEventListener('pointermove',e=>{if(drag)show(frac(e));});
  d.addEventListener('pointerup',e=>{if(!drag)return;drag=false;delete d.dataset.drag;P.seek(frac(e)*nowInfo().dur);});
  d.addEventListener('pointercancel',()=>{drag=false;delete d.dataset.drag;});
  d.addEventListener('keydown',e=>{const n=nowInfo();if(e.key==='ArrowRight'){P.seek(n.pos+10);e.preventDefault();}else if(e.key==='ArrowLeft'){P.seek(n.pos-10);e.preventDefault();}});}

/* rueda de volumen */
const knobVal=()=>S.ctrl?(S.rvol??.8):prefs.vol;
function bindKnob(k){const upd=()=>{k.style.setProperty('--a',(-135+270*knobVal())+'deg');k.setAttribute('aria-valuenow',Math.round(knobVal()*100));};upd();k._upd=upd;
  k.setAttribute('aria-valuemin','0');k.setAttribute('aria-valuemax','100');let y0=null,v0=0;
  k.addEventListener('pointerdown',e=>{y0=e.clientY;v0=knobVal();try{k.setPointerCapture(e.pointerId);}catch{}});
  k.addEventListener('pointermove',e=>{if(y0!=null)setVol(v0+(y0-e.clientY)/150);});
  k.addEventListener('pointerup',()=>{y0=null;savePrefsSoon();});k.addEventListener('pointercancel',()=>{y0=null;});
  k.addEventListener('wheel',e=>{e.preventDefault();setVol(knobVal()+(e.deltaY>0?-.04:.04));savePrefsSoon();},{passive:false});
  k.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'){setVol(knobVal()+.05);e.preventDefault();}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){setVol(knobVal()-.05);e.preventDefault();}savePrefsSoon();});}
const sendVol=debounce(v=>remoteCmd({op:'vol',v}),120);
function setVol(v){v=Math.max(0,Math.min(1,v));if(S.ctrl){S.rvol=v;sendVol(v);}else{prefs.vol=v;AE.applyVol();presenceSoon();}$$('[data-knob]').forEach(k=>k._upd&&k._upd());}

/* espectro de LEDs ámbar */
let specLast=0;
function specLoop(ts){requestAnimationFrame(specLoop);if(!prefs.viz)return;const car=document.body.classList.contains('carmode');if(ts-specLast<(car?55:33))return;specLast=ts;
  const cvs=$$('canvas.spec').filter(c=>c.offsetParent!==null);if(!cvs.length)return;const an=AE.n&&AE.n.an,live=!!an&&!AE.el.paused&&!S.ctrl;
  const data=an?new Uint8Array(an.frequencyBinCount):null;if(live)an.getByteFrequencyData(data);for(const c of cvs)drawSpec(c,data,live);}
function drawSpec(c,data,live){const dpr=Math.min(2,devicePixelRatio||1),W=c.clientWidth,H=c.clientHeight;if(!W||!H)return;
  if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);}
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const bars=Math.max(8,Math.min(32,Math.floor(W/14))),segs=Math.max(4,Math.floor(H/5)),bw=W/bars,sh=H/segs,len=data?data.length*.72:0;
  for(let b=0;b<bars;b++){let v=0;if(live){const lo=Math.floor(Math.pow(b/bars,1.7)*len),hi=Math.max(lo+1,Math.floor(Math.pow((b+1)/bars,1.7)*len));let s=0;for(let i=lo;i<hi;i++)s+=data[i];v=s/(hi-lo)/255;}
    const lit=Math.round(v*v*1.25*segs);for(let sg=0;sg<segs;sg++){x.fillStyle=sg<lit?(sg>=segs-2?'#ffd29a':'#ff9a2e'):'rgba(255,154,46,.09)';x.fillRect(b*bw+1,H-(sg+1)*sh+1,bw-2,sh-1.5);}}}
