<script>
"use strict";
/* ===================== frontal, "ahora suena", modo coche ===================== */
const savePrefsSoon=debounce(savePrefs,400);
function nowInfo(){
  if(S.ctrl){const p=S.peers.find(x=>x.peer===S.ctrl);const pr=(p&&p.presence)||{};const t=getTrack(pr.tid);const dur=pr.dur||(t&&t.du)||0;
    const pos=Math.min(dur||1e9,(pr.pos||0)+(pr.st==='play'?(Date.now()-(pr.at||Date.now()))/1000:0));
    return{t,id:pr.tid,title:t?(t.t||'Sin título'):'Nada sonando',sub:t?[t.a,t.al].filter(Boolean).join(' · '):'',cover:t&&t.c,pos,dur,playing:pr.st==='play',shuffle:!!pr.sh,repeat:pr.rp||'off',remote:pr.dn||'otro aparato'};}
  const t=P.current,d=AE.el;
  return{t,id:t&&t.id,title:t?(t.t||'Sin título'):'La Guantera',sub:t&&S.loading===t.id?'Cargando desde tu Drive…':t?[t.a,t.al].filter(Boolean).join(' · '):(S.tracks.size?'Elige algo que escuchar':'Sin música todavía'),
    cover:t&&t.c,pos:d.currentTime||0,dur:(isFinite(d.duration)&&d.duration)||(t&&t.du)||0,playing:!!t&&!d.paused,shuffle:P.shuffle,repeat:P.repeat,remote:null};}
function setMq(el,text){let span=el.firstElementChild;if(!span){span=h('span');el.append(span);}if(el.dataset.txt===text)return;el.dataset.txt=text;
  el.classList.remove('run');span.style.paddingRight='';span.textContent=text;
  requestAnimationFrame(()=>{if(el.clientWidth&&span.offsetWidth>el.clientWidth+2){span.textContent=text+' · '+text+' · ';span.style.paddingRight='0';
    el.style.setProperty('--mqd',Math.max(10,text.length*.45)+'s');el.classList.add('run');}});}
function renderPlayer(force){const n=nowInfo();if(force)$$('.mq').forEach(m=>delete m.dataset.txt);
  $$('[data-k=title]').forEach(el=>setMq(el,(n.remote?'▸ ':'')+n.title.toUpperCase()));
  $$('[data-k=sub]').forEach(el=>setMq(el,n.remote?'Sonando en el '+n.remote+(n.sub?' · '+n.sub:''):n.sub));
  $$('[data-k=cover]').forEach(el=>{const key=(n.cover||'')+'|'+n.title;if(el.dataset.c!==key){el.dataset.c=key;fillCover(el,n.cover,n.t?(n.t.al||n.title):'La Guantera');}});
  $$('[data-k=playbtn]').forEach(b=>{setIc(b.querySelector('svg'),n.playing?'pause':'play');b.setAttribute('aria-label',n.playing?'Pausar':'Reproducir');});
  $$('[data-k=shuf]').forEach(b=>b.classList.toggle('on',n.shuffle));
  $$('[data-k=rep]').forEach(b=>{b.classList.toggle('on',n.repeat!=='off');setIc(b.querySelector('svg'),n.repeat==='one'?'repeat1':'repeat');});
  $$('[data-k=like]').forEach(b=>{const on=!!(n.id&&S.likes[n.id]);b.classList.toggle('on',on);setIc(b.querySelector('svg'),on?'heartf':'heart');});
  $$('[data-k=devbtn]').forEach(b=>b.classList.toggle('on',!!S.ctrl));
  $$('[data-k=src]').forEach(el=>el.textContent=n.remote?'MANDO · '+n.remote.toUpperCase():(P.src&&P.current?collName(P.src).toUpperCase():''));
  updateTime();renderPresets();markCurrent();}
const updateLikeUI=()=>renderPlayer();
function onTrackChange(){updateMS();renderPlayer();renderDials();saveState();presenceSoon();renderQueueIfOpen();}
let lastMs=0;
function updateTime(){const n=nowInfo(),pos=n.pos,dur=n.dur,f=dur?Math.max(0,Math.min(1,pos/dur)):0;
  $$('[data-k=pos]').forEach(el=>el.textContent=fmt(pos));$$('[data-k=dur]').forEach(el=>el.textContent=dur?'-'+fmt(Math.max(0,dur-pos)):'--:--');
  $$('[data-dial]').forEach(d=>{if(d.dataset.drag)return;const nd=d.querySelector('.needle'),fl=d.querySelector('.fill');const x='calc(8px + (100% - 16px) * '+f+')';
    if(nd)nd.style.left=x;if(fl)fl.style.width=x;d.setAttribute('aria-valuenow',Math.round(pos));d.setAttribute('aria-valuetext',fmt(pos)+' de '+fmt(dur));});
  const mp=$('#mprog');if(mp)mp.style.width=(f*100)+'%';
  if(Date.now()-lastMs>5000){lastMs=Date.now();updateMSPos();}}
function renderDials(){const dur=nowInfo().dur||0;
  $$('[data-dial]').forEach(d=>{if(!d.firstChild){d.append(h('div',{class:'fill'}),h('div',{class:'ticks'}),h('div',{class:'nums'}),h('span',{class:'lab'},'MIN'),h('div',{class:'needle'}));
      d.tabIndex=0;d.setAttribute('role','slider');d.setAttribute('aria-label','Posición en la canción');d.setAttribute('aria-valuemin','0');bindDial(d);}
    const key=String(Math.round(dur));if(d.dataset.dur===key)return;d.dataset.dur=key;const nums=d.querySelector('.nums');nums.textContent='';
    if(dur>0){const m=dur/60,step=m<=8?1:m<=16?2:m<=40?5:10;for(let x=0;x<=m+1e-6;x+=step)nums.append(h('span',{style:'left:'+(x*60/dur*100)+'%'},String(x)));}
    d.setAttribute('aria-valuemax',Math.round(dur));});
  updateTime();}
function bindDial(d){const frac=e=>{const r=d.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left-8)/(r.width-16)));};let drag=false;
  const show=f=>{const x='calc(8px + (100% - 16px) * '+f+')';d.querySelector('.needle').style.left=x;d.querySelector('.fill').style.width=x;};
  d.addEventListener('pointerdown',e=>{if(!nowInfo().dur)return;drag=true;d.dataset.drag='1';try{d.setPointerCapture(e.pointerId);}catch{}show(frac(e));});
  d.addEventListener('pointermove',e=>{if(drag)show(frac(e));});
  d.addEventListener('pointerup',e=>{if(!drag)return;drag=false;delete d.dataset.drag;P.seek(frac(e)*nowInfo().dur);});
  d.addEventListener('pointercancel',()=>{drag=false;delete d.dataset.drag;});
  d.addEventListener('keydown',e=>{const n=nowInfo();if(e.key==='ArrowRight'){P.seek(n.pos+10);e.preventDefault();}else if(e.key==='ArrowLeft'){P.seek(n.pos-10);e.preventDefault();}});}

/* rueda de volumen */
const knobVal=()=>S.ctrl?(S.rvol??.8):prefs.vol;
function bindKnob(k){const upd=()=>{k.style.setProperty('--a',(-135+270*knobVal())+'deg');k.setAttribute('aria-valuenow',Math.round(knobVal()*100));};upd();k._upd=upd;
  k.setAttribute('aria-valuemin','0');k.setAttribute('aria-valuemax','100');let y0=null,v0=0;
  k.addEventListener('pointerdown',e=>{y0=e.clientY;v0=knobVal();try{k.setPointerCapture(e.pointerId);}catch{}});
  k.addEventListener('pointermove',e=>{if(y0!=null)setVol(v0+(y0-e.clientY)/150);});
  k.addEventListener('pointerup',()=>{y0=null;savePrefsSoon();});k.addEventListener('pointercancel',()=>{y0=null;});
  k.addEventListener('wheel',e=>{e.preventDefault();setVol(knobVal()+(e.deltaY>0?-.04:.04));savePrefsSoon();},{passive:false});
  k.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'){setVol(knobVal()+.05);e.preventDefault();}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){setVol(knobVal()-.05);e.preventDefault();}savePrefsSoon();});}
const sendVol=debounce(v=>remoteCmd({op:'vol',v}),120);
function setVol(v){v=Math.max(0,Math.min(1,v));if(S.ctrl){S.rvol=v;sendVol(v);}else{prefs.vol=v;AE.applyVol();presenceSoon();}$$('[data-knob]').forEach(k=>k._upd&&k._upd());}

/* espectro de LEDs ámbar */
let specLast=0;
function specLoop(ts){if(!prefs.viz||document.hidden||document.body.classList.contains('carmode')){setTimeout(()=>requestAnimationFrame(specLoop),600);return;}requestAnimationFrame(specLoop);if(ts-specLast<33)return;specLast=ts;
  const cvs=$$('canvas.spec').filter(c=>c.offsetParent!==null);if(!cvs.length)return;const an=AE.n&&AE.n.an,live=!!an&&!AE.el.paused&&!S.ctrl;
  const data=an?new Uint8Array(an.frequencyBinCount):null;if(live)an.getByteFrequencyData(data);for(const c of cvs)drawSpec(c,data,live);}
function drawSpec(c,data,live){const dpr=Math.min(2,devicePixelRatio||1),W=c.clientWidth,H=c.clientHeight;if(!W||!H)return;
  if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);}
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const bars=Math.max(8,Math.min(32,Math.floor(W/14))),segs=Math.max(4,Math.floor(H/5)),bw=W/bars,sh=H/segs,len=data?data.length*.72:0;
  for(let b=0;b<bars;b++){let v=0;if(live){const lo=Math.floor(Math.pow(b/bars,1.7)*len),hi=Math.max(lo+1,Math.floor(Math.pow((b+1)/bars,1.7)*len));let s=0;for(let i=lo;i<hi;i++)s+=data[i];v=s/(hi-lo)/255;}
    const lit=Math.round(v*v*1.25*segs);for(let sg=0;sg<segs;sg++){x.fillStyle=sg<lit?(sg>=segs-2?'#ffd29a':'#ff9a2e'):'rgba(255,154,46,.09)';x.fillRect(b*bw+1,H-(sg+1)*sh+1,bw-2,sh-1.5);}}}

/* emisoras 1-6 del frontal */
function renderPresets(){const box=$('#deckPresets');if(!box)return;const pm=presetMap();box.textContent='';

/* pantalla "ahora suena" */

        h('div',{class:'lcd big'},h('div',{class:'row'},h('span',{class:'dim','data-k':'src'}),h('span',null,h('span',{'data-k':'pos'},'0:00'),' ',h('span',{class:'dim','data-k':'dur'}))),
          h('div',{class:'mq','data-k':'title'},h('span')),h('div',{class:'mq l2','data-k':'sub'},h('span')),prefs.viz?h('div',{class:'spec-wrap'},h('canvas',{class:'spec'})):null),
        h('div',{class:'dial','data-dial':''}),
        h('div',{class:'np-ctl'},h('button',{class:'ibtn','data-act':'shuffle','data-k':'shuf','aria-label':'Aleatorio'},ic('shuffle'),h('span',{class:'led'})),
          h('button',{class:'ibtn','data-act':'prev','aria-label':'Anterior'},ic('prev')),
          h('button',{class:'round big chrome','data-act':'toggle','data-k':'playbtn','aria-label':'Reproducir'},ic('play','width:28px;height:28px')),
          h('button',{class:'ibtn','data-act':'next','aria-label':'Siguiente'},ic('next')),

function renderQueueIfOpen(){const box=$('#queueBox');if(!box)return;box.textContent='';
  if(S.ctrl){box.append(h('div',{class:'sub'},'La cola se maneja en el aparato que está sonando.'));return;}

      h('div',{class:'meta'},h('div',{class:'tt'},(cur?'▸ ':'')+(t.t||'')),h('div',{class:'ta'},t.a||'')),h('span'),h('span',{class:'du'},fmt(t.du)),
      cur?h('span'):h('button',{class:'ibtn','aria-label':'Quitar de la cola',onclick:()=>P.removeAt(i)},ic('close')));

/* ecualizador y efectos */

function openEq(){const g=AE.gains();
  const chips=h('div',{class:'row'},...Object.entries(EQP).map(([k,p])=>h('button',{class:'chip'+(prefs.eq===k?' on':''),onclick:()=>{prefs.eq=k;prefs.gains=null;savePrefs();AE.applyEq();AE.applyLevel();openEq();}},p.nm)),

  const xf=h('select',{id:'xfSel','aria-label':'Fundido entre canciones'},...[0,2,4,6,8,12].map(s=>h('option',{value:String(s),selected:prefs.xf===s},s?s+' s':'Sin fundido')));

    ...notes.map(n=>h('div',{class:'note'},n)),chips,eq,
    h('label',{class:'row'},h('span',{class:'label'},'Fundido entre canciones'),xf),
    tog('lvl','Nivelar volumen (canciones flojas y fuertes suenan parecido)','level',()=>AE.applyLevel()),
    tog('viz','Visualizador de LEDs','viz',()=>carRemount()),
    tog('fxOn','Efectos de sonido en este aparato (se aplica al recargar)','fx'));}

/* modo coche */
const carBtn=(act,icon,label)=>h('button',{class:'pbtn','data-act':act,'aria-label':label},ic(icon));
function goFull(){if(typeof SIM!=='undefined'&&SIM)return;try{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen({navigationUI:'hide'}).catch(()=>{});}catch{}}

function initRoom(){const R=C.room;
  R.onPeers(ch=>{S.peers=ch.peers.slice();const me=ch.peers.find(p=>p.sameTab);if(me)S.myPeer=me.peer;
    if(S.ctrl&&!S.peers.some(p=>p.peer===S.ctrl)){stopControl();toast('El otro aparato se ha desconectado');}
    renderDevices();if(S.ctrl){renderPlayer();renderDials();}},()=>{});
  R.on('cmd',msg=>{if(!msg.isMe||msg.sameTab)return;const d=msg.data||{};if(d.to!==S.myPeer)return;handleCmd(d);},()=>{});
  presenceNow();}
const presenceSoon=debounce(()=>presenceNow(),400);
function presenceNow(){if(!C.room||!device)return;const t=P.current,d=AE.el;
  C.room.presence({dev:device.id,dn:device.name,dk:device.kind,st:t&&!d.paused?'play':t?'pause':'idle',tid:t&&!t.test?t.id:null,
    pos:Math.round((d.currentTime||0)*10)/10,dur:Math.round(((isFinite(d.duration)&&d.duration)||(t&&t.du)||0)*10)/10,at:Date.now(),sh:P.shuffle,rp:P.repeat,vol:Math.round(prefs.vol*100)/100}).catch(()=>{});}

function remoteCmd(d){if(!S.ctrl)return;sendCmd(S.ctrl,d);if(d.op==='play')toast('Enviado al '+(ctrlName()||'otro aparato'));}
let ctrlTimer=0;
function startControl(peer){S.ctrl=peer;const p=S.peers.find(x=>x.peer===peer);S.rvol=(p&&p.presence&&p.presence.vol)??.8;clearInterval(ctrlTimer);
  ctrlTimer=setInterval(()=>updateTime(),1000);$$('[data-knob]').forEach(k=>k._upd&&k._upd());renderPlayer(true);renderDials();toast('Mandas en el '+(ctrlName()||'otro aparato'));}
function stopControl(){S.ctrl=null;clearInterval(ctrlTimer);$$('[data-knob]').forEach(k=>k._upd&&k._upd());renderPlayer(true);renderDials();}
function takeOver(p){sendCmd(p.peer,{op:'handoff',from:S.myPeer});toast('Pasando la música a este aparato…');}
function handleCmd(d){const ids=a=>(a||[]).filter(id=>S.tracks.has(id));
  switch(d.op){case 'play':P.play(ids(d.ids),d.start|0,d.src||'',d.sh===undefined?{}:{shuffle:!!d.sh});break;
    case 'toggle':P.toggle();break;case 'play1':P.resume();break;case 'pause':P.pause();break;case 'next':P.next();break;case 'prev':P.prev();break;
    case 'seek':P.seek(+d.pos||0);break;case 'shuffle':P.toggleShuffle();break;case 'repeat':P.cycleRepeat();break;
    case 'vol':setVol(+d.v);savePrefsSoon();break;case 'add':P.enqueue(ids(d.ids),false);break;case 'next-up':P.enqueue(ids(d.ids),true);break;
    case 'handoff':{const q=P.q.filter(id=>S.tracks.has(id)),ci=Math.max(0,q.indexOf(P.q[P.qi]));const pos=AE.el.currentTime||0;P.pause();
      sendCmd(d.from,{op:'take',q:q.slice(ci,ci+150),pos,src:P.src});break;}
    case 'take':{const q=ids(d.q);if(q.length){P.shuffle=false;P.orig=q.slice();P.q=q;P.src=d.src||'';P.load(0,{pos:+d.pos||0});}break;}}}
function openDevices(){openSheet(h('div',{class:'row'},h('h3',null,'Tus aparatos'),h('span',{class:'sp'}),h('button',{class:'ibtn',onclick:closeLayer,'aria-label':'Cerrar'},ic('close'))),h('div',{id:'devBox',class:'menu'}));renderDevices();}

    h('div',{class:'sub'},S.ctrl?'Estás manejando otro aparato':'La música suena aquí')),S.ctrl?h('button',{class:'pbtn',onclick:()=>{stopControl();renderDevices();}},'Volver a este'):null));

const DJ={busy:false,title:'',got:0,err:''};
function topArtistsLocal(n){const a=(S.stats&&S.stats.art)||{};return Object.entries(a).sort((x,y)=>y[1]-x[1]).slice(0,n).map(x=>x[0]);}

    if(bytes>maxBytes)break;}
  return{text:lines.join('\n'),idx};}
function djPrompt(req,n,listing){const d=new Date();

  const recent=((S.stats&&S.stats.recent)||[]).slice(0,15).map(r=>getTrack(r[0])).filter(Boolean).map(t=>t.t+' — '+t.a).join('; ');
  return 'Haces de DJ en el reproductor de música personal de quien te escribe. Solo puedes elegir canciones de SU biblioteca, que va al final: cada canción lleva delante un número.\n'+
    'Petición: '+req+'\nContexto: '+when+(where?', escuchando '+where:'')+'.'+(top?' Artistas que más escucha este mes: '+top+'.':'')+(recent?' Acaba de escuchar (no las repitas): '+recent+'.':'')+'\n'+
    'Arma una sesión de unas '+n+' canciones (menos si no hay suficientes que encajen) con un orden que fluya en energía, ritmo y época. No pongas más de dos seguidas del mismo artista. Usa lo que sabes de cada artista y canción para acertar con el ambiente.\n'+
    'Responde SOLO con líneas JSON, una por línea, sin nada más:\nprimera línea: {"titulo":"nombre corto y con gracia para la sesión","intro":"una frase en español de España, como un locutor de radio elegante, sin emojis"}\n'+
    'después, una línea por canción, en orden: {"n":número}\n\nBIBLIOTECA\n'+listing;}
async function claudeAsk(prompt,maxTokens=1600){const key=(S.cfg.apiKey||'').trim();if(!key)throw{code:'no_key'};if(!navigator.onLine)throw{code:'offline'};
  for(const model of [S.cfg.model||'claude-haiku-5-5','claude-haiku-4-5']){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model,max_tokens:maxTokens,messages:[{role:'user',content:prompt}]})});
    const j=await r.json().catch(()=>({}));

    if(!r.ok)throw{code:r.status===401?'bad_key':r.status===429?'rate_limited':(r.status===529||r.status===503)?'overloaded':r.status===400&&/credit/i.test((j.error&&j.error.message)||'')?'no_credit':'http_'+r.status};

async function runDj(req,label){

function viewDj(v){v.append(h('h1',null,'Claude DJ'),h('p',{class:'sub',style:'margin:0;max-width:62ch'},'Pídele un ambiente y monta una sesión solo con tu música. Tarda unos segundos en pensarla.'));

const WR={period:'mes',docs:null,busy:false,err:'',at:0,comment:'',cbusy:false};
async function loadWrapped(){WR.busy=true;
  try{if(!AUTH.ok())throw{code:'no_token'};const j=await gjson('/files',{spaces:'appDataFolder',q:"name contains 'escuchas-'",fields:'files(id,name)',pageSize:1000});
    WR.docs=(await Promise.all(j.files.map(f=>gfetch(G+'/files/'+f.id+'?alt=media').then(r=>r.json()).catch(()=>null)))).filter(Boolean);
    if(S.stats){const i=WR.docs.findIndex(d=>d.dev===S.stats.dev&&d.ym===S.stats.ym);if(i>=0)WR.docs[i]=S.stats;else WR.docs.push(S.stats);}WR.err='';}

  WR.busy=false;WR.at=Date.now();if(S.view==='resumen'&&!S.stack.length)renderView(true);}
function aggregate(period){const now=new Date(),y=String(now.getFullYear()),m=ym(now);

  const A={total:0,plays:{},secs:{},art:{},hrs:Array(24).fill(0),dev:{},days:new Set()};
  for(const d of docs){A.total+=d.total||0;for(const k in d.plays||{})A.plays[k]=(A.plays[k]||0)+d.plays[k];for(const k in d.secs||{})A.secs[k]=(A.secs[k]||0)+d.secs[k];
    for(const k in d.art||{})A.art[k]=(A.art[k]||0)+d.art[k];for(const k in d.hrs||{})if(A.hrs[+k]!=null)A.hrs[+k]+=d.hrs[k];
    const dn=d.dn||(KIND[d.dk]||{}).name||'Aparato';A.dev[dn]=(A.dev[dn]||0)+(d.total||0);for(const k in d.days||{})if(d.days[k]>0)A.days.add(d.ym+'-'+k);}

function longestStreak(days){const arr=[...days].map(s=>Date.parse(s+'T12:00:00')).filter(isFinite).sort((a,b)=>a-b);let best=0,cur=0,prev=null;

<script>
"use strict";
/* ===================== leer canciones de tu Drive ===================== */
const JUNK=/\s*[\[(【]([^\])】]*?)\b(official|oficial|video|v[ií]deo|audio|lyrics?|letra|visuali[sz]er|hd|hq|4k|remaster(ed)?|clip|mv|videoclip|en vivo|live)\b([^\])】]*)[\])】]/gi;
const cleanArtist=a=>String(a||'').replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/,'').replace(/\s*Official$/i,'').trim();
const cleanTitle=s=>String(s||'').replace(JUNK,'').replace(/\s+(official|oficial)\s+(music\s+)?(video|audio)\s*$/i,'').replace(/\s{2,}/g,' ').replace(/^["“']+|["”']+$/g,'').trim();
/* carpeta Artista / "Año - Álbum" / "NN - Título.mp3", o "Artista - Título.mp3" suelto */
function nameMeta(fn,path){path=path||[];let base=cleanTitle(String(fn).replace(/\.[^.]+$/,'').replace(/_/g,' '));
  let n=0;const mn=base.match(/^(\d{1,3})\s*[-.)]\s*(.+)$/);if(mn){n=+mn[1];base=mn[2].trim();}
  let a='',t=base;if(!path[0]){const m=base.split(/\s+[-–—|]\s+/);if(m.length>=2){a=m[0].trim();t=m.slice(1).join(' - ').trim();}}
  let al='',y='';const ad=path[1]||'';if(ad){const my=ad.match(/^(\d{4})\s*[-–.]\s*(.+)$/);if(my){y=my[1];al=my[2].trim();}else al=ad;}
  return{t:(t||String(fn)).slice(0,200),a:(cleanArtist(a)||path[0]||'').slice(0,160),al:al.slice(0,200),y,n};}
const u32=(b,o)=>((b[o]<<24)>>>0)+(b[o+1]<<16)+(b[o+2]<<8)+b[o+3];
const synch=(b,o)=>((b[o]&127)<<21)|((b[o+1]&127)<<14)|((b[o+2]&127)<<7)|(b[o+3]&127);
function dec(d,enc){try{if(enc===0)return new TextDecoder('windows-1252').decode(d);if(enc===3)return new TextDecoder('utf-8').decode(d);
  if(enc===1){if(d[0]===0xFE&&d[1]===0xFF)return new TextDecoder('utf-16be').decode(d.subarray(2));if(d[0]===0xFF&&d[1]===0xFE)return new TextDecoder('utf-16le').decode(d.subarray(2));return new TextDecoder('utf-16le').decode(d);}
  return new TextDecoder('utf-16be').decode(d);}catch{return'';}}
const txt=d=>d.length?dec(d.subarray(1),d[0]).replace(/\u0000[\s\S]*$/,'').trim():'';
function skipStr(d,q,enc){if(enc===1||enc===2){while(q+1<d.length&&!(d[q]===0&&d[q+1]===0))q+=2;return q+2;}while(q<d.length&&d[q]!==0)q++;return q+1;}
function deunsync(d){const o=[];for(let i=0;i<d.length;i++){o.push(d[i]);if(d[i]===0xFF&&d[i+1]===0)i++;}return new Uint8Array(o);}
function parseID3(b){const ver=b[3],flags=b[5],size=synch(b,6),end=Math.min(b.length,10+size),out={};let p=10;
  if(flags&0x40)p+=ver===4?synch(b,10):u32(b,10)+4;
  if(ver<3){const map={TT2:'t',TP1:'a',TP2:'aa',TAL:'al',TYE:'y',TCO:'g',TRK:'n',TPA:'d'};
    while(p+6<=end){const id=String.fromCharCode(b[p],b[p+1],b[p+2]),sz=(b[p+3]<<16)|(b[p+4]<<8)|b[p+5];if(!/^[A-Z0-9]{3}$/.test(id)||sz<=0||p+6+sz>b.length)break;
      const d=b.subarray(p+6,p+6+sz);if(map[id]){const v=txt(d);if(v&&!out[map[id]])out[map[id]]=v;}
      else if(id==='PIC'&&!out.pic){const q=skipStr(d,5,d[0]);out.pic={mime:/png/i.test(dec(d.subarray(1,4),0))?'image/png':'image/jpeg',data:d.subarray(q)};}p+=6+sz;}}
  else{const map={TIT2:'t',TPE1:'a',TPE2:'aa',TALB:'al',TYER:'y',TDRC:'y',TCON:'g',TRCK:'n',TPOS:'d'};
    while(p+10<=end){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
      const sz=ver===4?synch(b,p+4):u32(b,p+4),ff=b[p+9];if(sz<=0||p+10+sz>b.length)break;let d=b.subarray(p+10,p+10+sz);
      if(ver===4&&(ff&1))d=d.subarray(4);if((ver===4&&(ff&2))||(flags&0x80))d=deunsync(d);
      if(map[id]){const v=txt(d);if(v&&!out[map[id]])out[map[id]]=v;}
      else if(id==='APIC'&&!out.pic){let q=1;while(q<d.length&&d[q]!==0)q++;const mime=dec(d.subarray(1,q),0);q=skipStr(d,q+2,d[0]);out.pic={mime:/png/i.test(mime)?'image/png':'image/jpeg',data:d.subarray(q)};}
      p+=10+sz;}}
  out.y=(String(out.y||'').match(/\d{4}/)||[''])[0];out.n=parseInt(out.n,10)||0;out.d=parseInt(out.d,10)||0;out.g=String(out.g||'').replace(/^\(\d+\)\s*/,'').slice(0,40);return out;}
function mp3Duration(b,start,size){const BR1=[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320],BR2=[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160];
  const SR={3:[44100,48000,32000],2:[22050,24000,16000],0:[11025,12000,8000]};
  for(let i=start;i<Math.min(b.length-40,start+16384);i++){if(b[i]!==0xFF||(b[i+1]&0xE0)!==0xE0)continue;
    const vb=(b[i+1]>>3)&3,lb=(b[i+1]>>1)&3,bi=(b[i+2]>>4)&15,si=(b[i+2]>>2)&3,mode=(b[i+3]>>6)&3;if(vb===1||lb!==1||bi===0||bi===15||si===3)continue;
    const v1=vb===3,sr=SR[vb][si],spf=v1?1152:576,br=(v1?BR1:BR2)[bi]*1000,x=i+4+(v1?(mode===3?17:32):(mode===3?9:17));
    const tag=String.fromCharCode(b[x],b[x+1],b[x+2],b[x+3]);if((tag==='Xing'||tag==='Info')&&(u32(b,x+4)&1))return Math.round(u32(b,x+8)*spf/sr*10)/10;
    if(String.fromCharCode(b[i+36],b[i+37],b[i+38],b[i+39])==='VBRI')return Math.round(u32(b,i+50)*spf/sr*10)/10;
    return Math.round((size-i)*8/br*10)/10;}return 0;}
async function readTags(f){const isMp3=/\.mp3$/i.test(f.n||'')||f.mt==='audio/mpeg';if(!isMp3)return{};
  const get=async n=>new Uint8Array(await(await gfetch(G+'/files/'+f.id+'?alt=media',{headers:{Range:'bytes=0-'+n}})).arrayBuffer());
  let b=await get(65535),tagLen=0;
  if(b[0]===0x49&&b[1]===0x44&&b[2]===0x33){tagLen=10+synch(b,6)+((b[5]&0x10)?10:0);if(tagLen+8192>b.length&&tagLen<6e6)b=await get(tagLen+8191);}
  const out=tagLen?parseID3(b):{};const du=mp3Duration(b,tagLen,f.sz||0);if(du)out.du=du;return out;}
async function coverBlob(pic){try{const bmp=await createImageBitmap(new Blob([pic.data],{type:pic.mime}));const W=bmp.width,H=bmp.height;
  const side=Math.min(W,H),sx=(W-side)/2,sy=(H-side)/2,cv=document.createElement('canvas');cv.width=cv.height=Math.min(256,side);
  cv.getContext('2d').drawImage(bmp,sx,sy,side,side,0,0,cv.width,cv.height);if(bmp.close)bmp.close();return await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));}catch{return null;}}

const SYNC={running:false,phase:'',done:0,total:0,cancel:false,deep:false,last:LS.get('lastSync',0),
  async folderId(){const name=(S.cfg.folder||'YouTube MP3').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const j=await gjson('/files',{q:`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`,fields:'files(id,name)',pageSize:10,supportsAllDrives:true,includeItemsFromAllDrives:true});
    if(!j.files.length)throw{code:'no_folder'};return j.files[0].id;},
  async listAudio(root){const out=[],info=new Map([[root,[]]]);let level=[root],folders=0;
    while(level.length&&!this.cancel){const next=[];
      for(let i=0;i<level.length&&!this.cancel;i+=40){const q='('+level.slice(i,i+40).map(id=>`'${id}' in parents`).join(' or ')+') and trashed=false';let pt='';
        do{const p={q,fields:'nextPageToken,files(id,name,mimeType,size,modifiedTime,parents)',pageSize:1000,supportsAllDrives:true,includeItemsFromAllDrives:true};if(pt)p.pageToken=pt;
          const j=await gjson('/files',p);for(const f of j.files){const par=(f.parents||[]).find(x=>info.has(x));const path=par?info.get(par):[];
            if(f.mimeType==='application/vnd.google-apps.folder'){info.set(f.id,[...path,f.name]);next.push(f.id);folders++;}
            else if(/^audio\//.test(f.mimeType)||AUDIO_EXT.test(f.name))out.push({id:f.id,n:f.name,mt:f.mimeType,sz:+f.size||0,m:f.modifiedTime,path});}
          pt=j.nextPageToken;this.phase='Buscando canciones… '+out.length+' (en '+folders+' carpetas)';renderSyncSoon();}while(pt&&!this.cancel);}
      level=next;}return out;},
  async run(deep){if(this.running)return;if(!AUTH.ok()){toast('Conéctate con Google primero');return;}
    Object.assign(this,{running:true,cancel:false,deep,done:0,total:0,phase:'Buscando la carpeta «'+S.cfg.folder+'»…'});renderSyncSoon();renderSoon();
    try{const fid=await this.folderId();const files=await this.listAudio(fid);if(this.cancel)throw{code:'cancel'};
      const idx=LIB.idx&&LIB.idx.folder===fid?structuredClone(LIB.idx):{v:1,folder:fid,tracks:{}};const seen=new Set();let added=0,removed=0;
      for(const f of files){seen.add(f.id);const e=idx.tracks[f.id];
        if(!e||e.m!==f.m){idx.tracks[f.id]=Object.assign(nameMeta(f.n,f.path),{sz:f.sz,m:f.m,mt:f.mt,fn:f.n,ad:e?e.ad:Date.now(),x:0,ix:Date.now()});added++;}}
      for(const id in idx.tracks)if(!seen.has(id)){delete idx.tracks[id];removed++;}
      LIB.idx=idx;rebuildIndex();renderSoon();if(added||removed||!LIB.idx.at)await LIB.save();
      this.last=Date.now();LS.set('lastSync',this.last);
      this.phase=plural(files.length,'canción','canciones')+' en tu Drive'+(added?' · '+plural(added,'nueva','nuevas'):'')+(removed?' · '+plural(removed,'quitada','quitadas'):'');
      if(deep)await this.tags(idx);}
    catch(e){this.phase=e&&e.code==='no_folder'?'No encuentro la carpeta «'+S.cfg.folder+'» en tu Drive. Revisa el nombre en Ajustes de Tu Drive.':e&&e.code==='cancel'?'Parado.':
      e&&(e.code==='auth'||e.code==='no_token')?'Se ha cortado la conexión con Google. Toca Reconectar y sigue.':'Algo ha fallado ('+((e&&(e.status||e.code))||'error')+'). Vuelve a intentarlo.';}
    this.running=false;renderSync();renderSoon();},
  async tags(idx){const todo=Object.keys(idx.tracks).filter(id=>!idx.tracks[id].x);this.total=todo.length;this.done=0;if(!todo.length){return;}
    let since=0;const covers=idx.cv||(idx.cv={});
    const work=async()=>{while(todo.length&&!this.cancel&&AUTH.ok()){const id=todo.shift(),e=idx.tracks[id];if(!e)continue;

function woodTexture(){const W=512,H=64,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),img=x.createImageData(W,H),d=img.data;
  const R=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);};
  const nz=(px,py)=>{const i=Math.floor(px),j=Math.floor(py),fx=px-i,fy=py-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=R(i,j),b=R(i+1,j),c2=R(i,j+1),d2=R(i+1,j+1);return a+(b-a)*u+(c2-a)*v+(a-b-c2+d2)*u*v;};
  for(let y=0;y<H;y++)for(let X=0;X<W;X++){const n=nz(X/38,y/9)+nz(X/12,y/3)*.35,grain=Math.sin((y/H*7+n*5.5+X/W*1.3)*Math.PI*1.8),burl=nz(X/7,y/7);
    const t=Math.max(0,Math.min(1,.5+.32*grain+.18*(burl-.5))),o=(y*W+X)*4;d[o]=58+t*78;d[o+1]=28+t*40;d[o+2]=14+t*20;d[o+3]=255;}
  x.putImageData(img,0,0);return c.toDataURL('image/jpeg',.82);}

/* ===== luz de verdad: leyenda translúcida iluminada por una bombillita detrás =====
   - no es un color plano: el centro (donde está la bombilla) va casi blanco y los bordes se van a naranja oscuro
   - grano fino, como plástico translúcido; un poco de luz que se escapa alrededor
   - al encender, el filamento se calienta (pasa por rojo apagado); al apagar, se enfría despacio

<script>
/* ===== mini-motor de plantillas del modo coche (sin dependencias) ===== */
const CARRT=(()=>{
  function compile(src){
    src=src.replace(/\s(hint-[\w-]+)="[^"]*"/g,'').replace(/\son([A-Z]\w*)="/g,(m,n)=>' data-on-'+n.toLowerCase()+'="').replace(/\skey="/g,' data-key="');
    const re=/<sc-(for|if)\b([^>]*)>|<\/sc-(for|if)>|\{\{\s*([^}]+?)\s*\}\}/g;const root={k:'root',c:[]},st=[root];let i=0,m;
    const top=()=>st[st.length-1];
    while((m=re.exec(src))){if(m.index>i)top().c.push(src.slice(i,m.index));i=re.lastIndex;
      if(m[1]){const a=n=>{const x=new RegExp(n+'="\\{\\{\\s*([^}]+?)\\s*\\}\\}"').exec(m[2]);return x&&x[1].split('.');};
        const n=m[1]==='for'?{k:'for',list:a('list'),as:/as="(\w+)"/.exec(m[2])[1],c:[]}:{k:'if',val:a('value'),c:[]};top().c.push(n);st.push(n);}
      else if(m[3])st.pop();else top().c.push({k:'h',p:m[4].split('.')});}
    if(i<src.length)root.c.push(src.slice(i));return root;}
  const get=(sc,p)=>{let v=sc[p[0]];for(let i=1;i<p.length&&v!=null;i++)v=v[p[i]];return v;};
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
