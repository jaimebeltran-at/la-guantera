function pcQRow(i,cur){const t=getTrack(P.q[i]);if(!t)return'';return '<button class="pc-qr'+(cur?' on':'')+'" data-qi="'+i+'">'+pcCov(t.c,44,'',(t.t||'?')[0])+'<span style="min-width:0;flex:1"><span class="t1 pc-ell">'+escH(t.t||'')+'</span><span class="t2 pc-ell">'+escH(t.a||'')+'</span></span></button>';}
function pcCover(t){const cv=pcE('pcCv');if(!cv)return;const key=t?(t.c||'h:'+t.id):'none';if(key===PC.cvKey)return;PC.cvKey=key;const x=cv.getContext('2d');
  const N=64,Z=520/N,draw=px=>{x.clearRect(0,0,520,520);const pal=[[34,16,6],[106,50,14],[196,86,26],[255,122,26],[255,179,92],[255,232,190]];
    for(let j=0;j<N;j++)for(let i=0;i<N;i++){const v=px(i,j),k=Math.max(0,Math.min(5,Math.round(v*5))),c=pal[k];
      if(k>=3){x.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',.15)';x.fillRect(i*Z,j*Z,Z,Z);}x.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';x.beginPath();x.arc(i*Z+Z/2,j*Z+Z/2,Z*.36,0,6.3);x.fill();}};
  const hs=hashStr(key),cx=24+(hs%17),cy=22+((hs>>4)%18);draw((i,j)=>Math.max(.08,1-Math.hypot(i-cx,j-cy)/36)*(.75+.25*Math.sin((i+j+(hs&7))/3)));
  if(!t||!t.c)return;COV.url(t.c).then(u=>{if(!u||PC.cvKey!==key)return;const im=new Image();im.decoding='async';im.onload=()=>{if(PC.cvKey!==key)return;try{const c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d',{willReadFrequently:true});
    const s=Math.min(im.width,im.height);g.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,N,N);const d=g.getImageData(0,0,N,N).data;draw((i,j)=>{const o=(j*N+i)*4;return Math.pow((.3*d[o]+.59*d[o+1]+.11*d[o+2])/255,.9);});}catch{}};im.src=u;}).catch(()=>{});}

/* emisoras y modos */
function pcStn(){const k=PC.ST.findIndex(s=>s.key===(P.src||LS.get('carStn','')));return k>=0?k:0;}
function pcTune(k){const s=PC.ST[k];if(!s)return;const ids=collIds(s.key);LS.set('carStn',s.key);
  if(!ids.length){pcSay(!S.tracks.size?'SIN MÚSICA TODAVÍA':s.key==='likes'?'AÚN NO HAY FAVORITOS · DOBLE CLIC EN UNA PORTADA':s.full+' · SIN CANCIONES AÚN');return;}
  prefs.radio=false;P.radioSeed=null;P.repeat='off';PC.applied=PC.mode=PC.prevMode='shuf';P.play(ids,-1,s.key,{shuffle:true});pcSay('EMISORA '+s.f+' Hz · '+s.full);}
function pcPlay(k,shuffle){if(k==='all'&&!shuffle){P.play(collIds('all'),0,'all',{shuffle:false});return;}const st=PC.ST.findIndex(s=>s.key===k);if(st>=0)return pcTune(st);
  pcLeaveSpecial();const ids=collIds(k);if(!ids.length){pcSay('NO HAY CANCIONES');return;}P.play(ids,shuffle?-1:0,k,{shuffle:!!shuffle});}
function pcLeaveSpecial(){if(PC.applied!=='shuf'){prefs.radio=false;P.radioSeed=null;P.repeat='off';PC.applied=PC.mode=PC.prevMode='shuf';}}
function pcSetMode(m){if(m==='off'){P.toggleShuffle();pcSay(P.shuffle?'ALEATORIO':'EN ORDEN');pcModesUI();return;}if(pcApply(m)){pcSay({shuf:'ALEATORIO',radio:'RADIO · '+String((P.current||{}).t||'').toUpperCase(),once:'ESTA SONARÁ UNA VEZ MÁS'}[m]);}}
function pcApply(m){const cur=P.current,was=PC.applied;
  if(m==='once'){if(!cur){pcSay('NO HAY NADA SONANDO');return false;}P.repeat='one';PC.onceId=cur.id;PC.lastPos=nowInfo().pos;if(was!=='once')PC.prevMode=was;PC.applied='once';pcModesUI();return true;}
  P.repeat='off';PC.onceId=null;
  if(was==='once'&&m===PC.prevMode){PC.applied=PC.mode=m;pcAfterMode();return true;}
  if(m==='radio'){if(!cur||cur.test){pcSay('PON UNA CANCIÓN DE TU MÚSICA PRIMERO');return false;}
    if(P.src!=='radio')PC.baseSrc=P.src;prefs.radio=true;P.radioSeed=cur;P.radioHint=/^rad:/.test(PC.baseSrc||'')?PC.baseSrc.slice(4):null;
    const more=similarTo(cur,40,new Set([cur.id]),P.radioHint);P.q=P.q.slice(0,P.qi+1).concat(more);P.orig=null;P.shuffle=false;P.src='radio';
    try{if(typeof CarUI!=='undefined'){PC.raCtx=PC.raCtx||{say:m2=>{pcSay(m2);pcRenderRight();}};CarUI.prototype.radioAsk.call(PC.raCtx,cur);}}catch{}}
  else{prefs.radio=false;P.radioSeed=null;if(was==='radio'||(was==='once'&&PC.prevMode==='radio')){const key=PC.baseSrc&&PC.baseSrc!=='radio'?PC.baseSrc:PC.ST[pcStn()].key,ids=collIds(key).filter(id=>!cur||id!==cur.id);
      P.q=(cur?[cur.id]:[]).concat(shuffleArr(ids));P.qi=0;P.orig=null;P.src=key;P.shuffle=true;}else if(cur){if(!P.shuffle)P.toggleShuffle();}else P.shuffle=true;}
  PC.applied=PC.mode=PC.prevMode=m;try{savePrefs();}catch{}pcAfterMode();return true;}
function pcAfterMode(){pcModesUI();pcRenderRight();try{renderQueueIfOpen();}catch{}}
function pcLike(id){const t=id?getTrack(id):P.current;if(!t||t.test){pcSay('NADA QUE GUARDAR');return;}const was=S.likes[t.id]>0;toggleLike(t.id);pcSay(was?'QUITADA DE ME GUSTA':'♥ GUARDADA EN ME GUSTA');setTimeout(pcRefreshLikes,50);}
function pcRefreshLikes(){if(!PC.on)return;pcTrack();pcRenderLib();document.querySelectorAll('#pcBody [data-like]').forEach(b=>{const on=S.likes[b.dataset.like]>0;b.classList.toggle('on',on);b.innerHTML=on?PCI.heartF:PCI.heart;});}
function pcNewList(){const nm=(prompt('Nombre de la nueva lista')||'').trim();if(!nm)return;const id=rid(8);plWrite(id,{nm,ids:[],cr:Date.now(),up:Date.now(),ps:null});setTimeout(()=>{pcRenderLib();pcOpen('pl:'+id);},80);}

/* clics */
function pcClick(e){const t=e.target;let b;
  if((b=t.closest('[data-play]'))){e.stopPropagation();pcPlay(b.dataset.play,false);return;}
  if((b=t.closest('[data-shufplay]'))){pcPlay(b.dataset.shufplay,true);return;}
  if((b=t.closest('[data-like]'))){pcLike(b.dataset.like);return;}
  if((b=t.closest('[data-enq]'))){P.enqueue([b.dataset.enq],true);pcSay('SONARÁ A CONTINUACIÓN');setTimeout(pcRenderRight,60);return;}
  if((b=t.closest('[data-more]'))){PC.lim+=500;pcRenderMain(true);return;}
  if((b=t.closest('[data-rowplay]'))){const r=b.closest('.pc-tr');pcRowPlay(r);return;}
  if((b=t.closest('[data-qi]'))){P.load(+b.dataset.qi);return;}
  if((b=t.closest('[data-right]'))){pcRight(b.dataset.right);return;}
  if((b=t.closest('[data-radioof]'))){const id=b.dataset.radioof;if(id){P.play([id],0,'tr:'+id);setTimeout(()=>pcSetMode('radio'),400);}return;}
  if((b=t.closest('[data-libf]'))){PC.libF=b.dataset.libf;pcRenderLib();return;}
  if((b=t.closest('[data-gov]'))){pcGo({v:b.dataset.gov});return;}
  if((b=t.closest('[data-artist]'))&&b.dataset.artist){pcGo({v:'artist',k:'ar:'+b.dataset.artist});return;}
  if((b=t.closest('[data-album]'))&&b.dataset.album){pcGo({v:'coll',k:'al:'+b.dataset.album});return;}
  if((b=t.closest('[data-fav]'))){toggleFav(b.dataset.fav);return;}
  if((b=t.closest('[data-hdel]'))){SH.del(+b.dataset.hdel);pcRenderMain(true);return;}
  if((b=t.closest('[data-hclear]'))){SH.clear();pcRenderMain(true);return;}
  if((b=t.closest('[data-hp]'))){const x=SH.get()[+b.dataset.hp];if(x){SH.add(x);if(x.k==='t')playRadioFrom(x.id);else if(x.k==='q'){PC.q=x.q;pcE('pcQ').value=x.q;pcRenderMain(true);}else pcOpen(x.k+':'+x.id);}return;}
  if((b=t.closest('[data-sf]'))){PC.sf=b.dataset.sf;pcRenderMain(true);return;}
  if((b=t.closest('[data-open]'))){if(PC.view.v==='search'&&PC.q&&/^(ar|al):/.test(b.dataset.open))SH.add({k:b.dataset.open.slice(0,2),id:b.dataset.open.slice(3)});pcOpen(b.dataset.open);return;}}
function pcDbl(e){const t=e.target;if(t.closest('#pcCv')){pcLike();return;}const r=t.closest('.pc-tr[data-id]');if(r&&!t.closest('button'))pcRowPlay(r);}
function pcRowPlay(r){const k=r.dataset.k,ids=(PC.lists&&PC.lists[k])||[r.dataset.id];pcLeaveSpecial();if(/^search/.test(k)){const id=ids[+r.dataset.i];SH.add({k:'t',id});playRadioFrom(id);return;}P.play(ids,+r.dataset.i,k,{shuffle:false});}

/* enganches con el resto de la app */
{const _ra=renderAll;renderAll=function(){_ra();if(PC.on){pcRenderLib();if(PC.view.v!=='search')pcRenderMain(true);pcTrack();}};}
{const _otc=onTrackChange;onTrackChange=function(){_otc();if(PC.on)pcTrack();};}
{const _ul=updateLikeUI;updateLikeUI=function(){_ul();if(PC.on)pcRefreshLikes();};}
document.addEventListener('keydown',e=>{if(!PC.on)return;if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))){if(e.key==='Escape')e.target.blur();return;}
  if(e.key==='/'||(e.key==='k'&&(e.ctrlKey||e.metaKey))){e.preventDefault();pcE('pcQ').focus();}
  else if(e.key==='ArrowRight'&&!e.target.closest('[role=slider]'))P.seek(nowInfo().pos+10);else if(e.key==='ArrowLeft'&&!e.target.closest('[role=slider]'))P.seek(nowInfo().pos-10);
  else if(e.key==='l'||e.key==='L')pcLike();else if(e.key==='Backspace'&&e.altKey)pcBackNav();});
</script>

<script>try{boot();}catch(e){console.error('boot',e);}</script>
